<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMR Autoxing CBI — Harmonisasi Supply</title>
<style>
/* ============================================================
   AMR Autoxing CBI — Middleware Portal
   Single-file clone of SYS-AX Middleware layout.
   Data is stored in localStorage (keys prefixed "amr_") so it
   can be populated later via the Add/Edit actions on each page.
   ============================================================ */

:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --sidebar:#ffffff;
  --border:#eceef1;
  --border-2:#e4e7eb;
  --text:#0f172a;
  --text-2:#475569;
  --muted:#94a3b8;
  --brand:#14b8a6;         /* teal icons / links */
  --brand-2:#17c3a3;       /* buttons */
  --brand-strong:#0ea38b;
  --brand-tint:#e9faf5;
  --brand-tint-2:#d5f4ec;
  --amber:#f59e0b;
  --amber-tint:#fef3e2;
  --red:#ef4444;
  --red-tint:#fdecec;
  --green:#16a34a;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(16,24,40,.10);
  --radius:14px;
  --radius-sm:10px;
  --sidebar-w:256px;
}
html[data-theme="dark"]{
  --bg:#0b1220;
  --surface:#111a2b;
  --surface-2:#0e1626;
  --sidebar:#0d1524;
  --border:#1e293b;
  --border-2:#24344a;
  --text:#e6edf6;
  --text-2:#9fb0c4;
  --muted:#64748b;
  --brand-tint:rgba(20,184,166,.12);
  --brand-tint-2:rgba(20,184,166,.18);
  --amber-tint:rgba(245,158,11,.14);
  --red-tint:rgba(239,68,68,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:margin-left .25s ease;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:20px 20px;
  border-bottom:1px solid var(--border);
}
.brand .mark{
  width:40px;height:40px;border-radius:11px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 12px rgba(20,184,166,.35);
}
.brand .mark svg{width:22px;height:22px}
.brand .txt{line-height:1.15}
.brand .txt b{font-size:15px;font-weight:800;letter-spacing:.2px;display:block}
.brand .txt span{font-size:12px;color:var(--text-2)}

.nav{flex:1;overflow-y:auto;padding:12px 12px 8px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text);font-weight:500;
  cursor:pointer;user-select:none;position:relative;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2)}
.nav-item .ic{width:18px;height:18px;color:var(--brand);flex:0 0 18px}
.nav-item.parent .ic{color:var(--text-2)}
.nav-item .caret{margin-left:auto;color:var(--muted);transition:transform .18s}
.nav-item.open .caret{transform:rotate(90deg)}
.nav-item.active{background:var(--brand-tint);color:var(--brand-strong)}
.nav-item.active .ic{color:var(--brand-strong)}
.nav-group{margin-bottom:2px}
.nav-children{
  margin:2px 0 2px 22px;padding-left:12px;
  border-left:1px solid var(--border-2);
  overflow:hidden;
}
.nav-children .nav-item{padding:8px 12px;font-weight:500}
.subheading{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;
  padding:14px 14px 6px;
}

.sidebar-foot{
  border-top:1px solid var(--border);
  padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;
}
.avatar{
  width:38px;height:38px;border-radius:10px;flex:0 0 38px;
  background:var(--brand-tint);color:var(--brand-strong);
  display:grid;place-items:center;font-weight:800;font-size:13px;
}
.sidebar-foot .who b{display:block;font-size:13.5px;font-weight:700}
.sidebar-foot .who span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sidebar-foot .logout{margin-left:auto;color:var(--muted);padding:6px;border-radius:8px;background:none;border:0}
.sidebar-foot .logout:hover{color:var(--red);background:var(--red-tint)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:64px;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:0;background:none;
  color:var(--text-2);display:grid;place-items:center;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:14px;flex-wrap:wrap}
.breadcrumb .sep{color:var(--muted)}
.breadcrumb .cur{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.session-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);padding:6px 12px;border-radius:999px;
  font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;
}
.session-pill svg{width:15px;height:15px;color:var(--muted)}
.topbar .divider{width:1px;height:24px;background:var(--border)}

/* ---------- Content ---------- */
.content{padding:28px 32px 48px;max-width:1360px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:22px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:240px}
h1.page-title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.page-sub{color:var(--text-2);font-size:14.5px;margin:0}
.head-actions{display:flex;gap:10px;align-items:center;margin-left:auto}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--border-2);background:var(--surface);color:var(--text);
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;
  transition:background .12s,border-color .12s,transform .05s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;box-shadow:0 4px 12px rgba(20,184,166,.28)}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn-ghost{background:none;border-color:var(--border)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.section-label{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;margin:26px 0 12px;
}
.section-label svg{width:15px;height:15px;color:var(--brand)}
.grid{display:grid;gap:16px}

/* ---------- Table ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:12.5px;font-weight:700;color:var(--text-2);
  padding:14px 18px;border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:15px 18px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.cell-strong{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tbl-foot{display:flex;align-items:center;gap:18px;padding:14px 18px;flex-wrap:wrap;color:var(--text-2);font-size:13px}
.tbl-foot .grow{flex:1}
.select-mini{border:1px solid var(--border-2);background:var(--surface);border-radius:8px;padding:5px 8px;color:var(--text);font-size:13px}
.pager{display:flex;gap:4px}
.pager button{width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:8px;color:var(--text-2)}
.pager button:hover:not(:disabled){background:var(--surface-2)}
.pager button:disabled{opacity:.4;cursor:default}

/* ---------- Badges & chips ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;line-height:1}
.badge.green{background:var(--brand-tint);color:var(--brand-strong)}
.badge.gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.badge.amber{background:var(--amber-tint);color:#b45309}
.badge.red{background:var(--red-tint);color:#dc2626}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:linear-gradient(135deg,#fde68a,#fbbf24);color:#7c4a03}
.chip.robot{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#6b3d02}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.dot.off{background:var(--muted)}

/* ---------- Action icons in table ---------- */
.actions{display:flex;gap:4px;align-items:center}
.act{width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--text-2);display:grid;place-items:center}
.act:hover{background:var(--surface-2)}
.act svg{width:16px;height:16px}
.act.brand{color:var(--brand)}
.act.brand:hover{background:var(--brand-tint)}
.act.amber{color:var(--amber)}.act.amber:hover{background:var(--amber-tint)}
.act.danger{color:var(--red)}.act.danger:hover{background:var(--red-tint)}

/* ---------- Stat / telemetry cards ---------- */
.tele-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.tele-card{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.tele-card .name{font-weight:700;font-size:15px}
.tele-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tele-row{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:13px;margin-top:8px}
.tele-row .l{display:flex;align-items:center;gap:8px}
.tele-row .l svg{width:15px;height:15px;color:var(--muted)}
.batt{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.batt svg{width:18px;height:18px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:6px}
.stat{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.stat .top{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:13px;font-weight:600}
.stat .top svg{width:18px;height:18px;color:var(--brand)}
.stat .big{font-size:30px;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.stat .cap{color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- Filters ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-2);text-transform:uppercase;margin-bottom:6px}
.field select,.field input{
  width:100%;border:1px solid var(--border-2);background:var(--surface);
  color:var(--text);padding:10px 12px;border-radius:10px;font-size:13.5px;
}
.field input[type="datetime-local"]{color:var(--text-2)}

/* ---------- Lifecycle timeline ---------- */
.lifecycle{display:flex;gap:20px;flex-wrap:wrap}
.lc{min-width:64px}
.lc .k{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.lc .v{font-size:12.5px;font-weight:700;color:var(--brand-strong);font-variant-numeric:tabular-nums}
.lc.empty .v{color:var(--muted)}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;padding:56px 24px;color:var(--text-2);
}
.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.empty .ic svg{width:26px;height:26px}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:700;color:var(--text)}
.empty p{margin:0 auto 18px;max-width:420px}

/* ---------- Machine Call ---------- */
.mc-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mc-head .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center}
.mc-head .ic svg{width:26px;height:26px}
.mc-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:.02em}
.mc-head .loc{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--brand-strong);display:flex;align-items:center;gap:5px;text-transform:uppercase}
.mc-head .eng{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--amber);background:var(--amber-tint);padding:7px 12px;border-radius:999px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.status-bar{
  display:flex;align-items:center;gap:18px;
  border:2px dashed var(--brand-tint-2);border-radius:16px;padding:18px 22px;margin:18px 0;background:var(--surface)
}
.status-bar .clk{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.status-bar .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.status-bar .v{font-size:18px;font-weight:800;color:var(--brand-strong)}
.status-bar .pipe{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.status-bar .pulse{border:1px solid var(--border);border-radius:12px;padding:8px 14px;text-align:center}
.status-bar .pulse .k{color:var(--muted)}
.status-bar .pulse b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}

.call-panel{border:1px solid var(--border);border-radius:20px;padding:22px;background:var(--surface);box-shadow:var(--shadow)}
.call-reason{margin-bottom:18px}
.call-reason .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--brand-strong);text-transform:uppercase;margin-bottom:8px}
.call-reason select{border:1px solid var(--border-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;color:var(--text)}
.call-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.call-btn{
  border:1px solid var(--border);border-radius:18px;padding:40px 20px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  background:var(--surface-2);color:var(--muted);font-weight:800;letter-spacing:.06em;font-size:20px;
  transition:transform .08s,box-shadow .12s;
}
.call-btn .cico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.call-btn .cico svg{width:28px;height:28px}
.call-btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;box-shadow:0 12px 30px rgba(20,184,166,.35)}
.call-btn.primary .cico{background:rgba(255,255,255,.22);color:#fff}
.call-btn.primary:hover{transform:translateY(-2px)}
.call-foot{text-align:center;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}

/* ---------- Area Monitor ---------- */
.am-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.am-head .ic{width:48px;height:48px;border-radius:13px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center}
.am-head h2{margin:0;font-size:26px;font-weight:800}
.am-head .sub{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.am-head .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--brand-strong)}
.am-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
.map3d{position:relative;border-radius:16px;overflow:hidden;min-height:440px;background:#0b1220;border:1px solid var(--border)}
.map3d canvas{display:block;width:100%;height:100%}
.control-center{
  position:absolute;top:18px;left:18px;width:220px;
  background:rgba(13,20,34,.82);backdrop-filter:blur(6px);
  border:1px solid rgba(45,212,191,.25);border-radius:14px;padding:16px;color:#cbd5e1;
}
.control-center h4{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#2dd4bf;text-transform:uppercase}
.cc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px}
.cc-row .kbd{background:#1e293b;border:1px solid #334155;border-radius:7px;padding:3px 8px;font-size:11px;color:#e2e8f0;font-family:ui-monospace,monospace}
.cc-meta{border-top:1px solid #24344a;margin-top:12px;padding-top:12px;font-size:11px;color:#94a3b8}
.cc-meta b{color:#e2e8f0}
.cc-reset{width:100%;margin-top:14px;background:var(--brand-2);border:0;color:#fff;border-radius:10px;padding:9px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.robot-status .head,.order-q .head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:14px}
.robot-status .head::before,.order-q .head::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.rstat{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.rstat .r1{display:flex;align-items:center;justify-content:space-between}
.rstat .idle{margin-top:12px;background:var(--surface-2);border-radius:9px;padding:9px 12px;color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:8px}
.order-q{margin-top:20px}
.order-q .empty-q{text-align:center;color:var(--muted);padding:40px 10px;font-style:italic}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal .m-head{display:flex;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border)}
.modal .m-head h3{margin:0;font-size:18px;font-weight:800}
.modal .m-body{padding:22px;display:grid;gap:16px;max-height:64vh;overflow:auto}
.modal .m-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-field label{display:block;font-size:12px;font-weight:700;color:var(--brand-strong);margin-bottom:6px}
.form-field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.form-field input,.form-field select,.form-field textarea{
  width:100%;border:1px solid var(--border-2);background:var(--surface);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;
}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slidein .25s ease}
html[data-theme="dark"] .toast{background:#e6edf6;color:#0b1220}
.toast svg{width:17px;height:17px;color:var(--brand-2)}

let root = null, gaya = null;


/* =======================================================================
   BAGIAN 1 — Parser ROS1 bag murni JavaScript (tanpa library apa pun)
   ======================================================================= */
const TD = new TextDecoder();

function lz4Block(src, sIdx, sEnd, dst, dIdx){
  while(sIdx < sEnd){
    const token = src[sIdx++];
    let litLen = token >> 4;
    if(litLen === 15){ let b; do{ b = src[sIdx++]; litLen += b; }while(b === 255); }
    for(let n=0;n<litLen;n++) dst[dIdx++] = src[sIdx++];
    if(sIdx >= sEnd) break;
    const offset = src[sIdx++] | (src[sIdx++] << 8);
    let mLen = token & 15;
    if(mLen === 15){ let b; do{ b = src[sIdx++]; mLen += b; }while(b === 255); }
    mLen += 4;
    let p = dIdx - offset;
    for(let n=0;n<mLen;n++) dst[dIdx++] = dst[p++];
  }
  return dIdx;
}
function lz4Frame(src, expected){
  let i = 4;                       // lewati magic
  const flg = src[i++]; i++;       // FLG, BD
  if((flg>>3)&1) i += 8;           // content size
  if(flg&1) i += 4;                // dict id
  i++;                             // header checksum
  const blockChecksum = (flg>>4)&1;
  const dst = new Uint8Array(expected);
  let o = 0;
  while(i + 4 <= src.length){
    const bs = (src[i] | src[i+1]<<8 | src[i+2]<<16 | src[i+3]<<24) >>> 0; i += 4;
    if(bs === 0) break;
    const rawBlock = (bs & 0x80000000) !== 0;
    const size = bs & 0x7FFFFFFF;
    if(rawBlock){ dst.set(src.subarray(i, i+size), o); o += size; }
    else { o = lz4Block(src, i, i+size, dst, o); }
    i += size;
    if(blockChecksum) i += 4;
  }
  return dst.subarray(0, o);
}
function fields(u8, dv, start, end){
  const f = {}; let p = start;
  while(p < end){
    const len = dv.getUint32(p, true); p += 4;
    const b = u8.subarray(p, p+len); p += len;
    const eq = b.indexOf(61);
    f[TD.decode(b.subarray(0, eq))] = b.subarray(eq+1);
  }
  return f;
}
const u32 = b => (b[0] | b[1]<<8 | b[2]<<16 | b[3]<<24) >>> 0;

const PRIM = new Set(['bool','int8','uint8','char','byte','int16','uint16','int32',
  'uint32','int64','uint64','float32','float64','string','time','duration']);

function parseDefs(text, rootType){
  const defs = {};
  const blocks = text.split(/^=+$/m);
  let name = rootType;
  blocks.forEach((blk, idx) => {
    let body = blk;
    if(idx > 0){
      const m = blk.match(/^\s*MSG:\s*(\S+)/m);
      if(!m) return;
      name = m[1];
      body = blk.slice(blk.indexOf(m[0]) + m[0].length);
    }
    const pkg = name.includes('/') ? name.split('/')[0] : 'std_msgs';
    const flds = [];
    for(let line of body.split('\n')){
      const h = line.indexOf('#'); if(h >= 0) line = line.slice(0, h);
      line = line.trim(); if(!line) continue;
      const parts = line.split(/\s+/);
      if(parts.length < 2) continue;
      if(parts[1].includes('=') || parts[2] === '=') continue;   // konstanta, lewati
      let type = parts[0]; const fname = parts[1];
      let isArr = false, arrLen = -1;
      const am = type.match(/^(.+)\[(\d*)\]$/);
      if(am){ isArr = true; type = am[1]; arrLen = am[2] ? parseInt(am[2]) : -1; }
      if(!PRIM.has(type) && !type.includes('/'))
        type = (type === 'Header') ? 'std_msgs/Header' : pkg + '/' + type;
      flds.push({name:fname, type, isArr, arrLen});
    }
    defs[name] = flds;
    if(name.includes('/')) defs[name.split('/').pop()] = flds;
  });
  return defs;
}
function readPrim(dv, u8, p, type){
  switch(type){
    case 'bool': return [!!u8[p], p+1];
    case 'int8': return [dv.getInt8(p), p+1];
    case 'uint8': case 'char': case 'byte': return [u8[p], p+1];
    case 'int16': return [dv.getInt16(p,true), p+2];
    case 'uint16': return [dv.getUint16(p,true), p+2];
    case 'int32': return [dv.getInt32(p,true), p+4];
    case 'uint32': return [dv.getUint32(p,true), p+4];
    case 'int64': return [Number(dv.getBigInt64(p,true)), p+8];
    case 'uint64': return [Number(dv.getBigUint64(p,true)), p+8];
    case 'float32': return [dv.getFloat32(p,true), p+4];
    case 'float64': return [dv.getFloat64(p,true), p+8];
    case 'string': { const n = dv.getUint32(p,true); p += 4; return [TD.decode(u8.subarray(p,p+n)), p+n]; }
    case 'time': case 'duration': return [dv.getUint32(p,true) + dv.getUint32(p+4,true)/1e9, p+8];
  }
  throw new Error('tipe tidak dikenal: ' + type);
}
const PSIZE = {bool:1,int8:1,uint8:1,char:1,byte:1,int16:2,uint16:2,int32:4,uint32:4,
               int64:8,uint64:8,float32:4,float64:8,time:8,duration:8};
function deser(dv, u8, p, type, defs){
  if(PRIM.has(type)) return readPrim(dv, u8, p, type);
  const flds = defs[type] || defs[type.split('/').pop()];
  if(!flds) throw new Error('definisi hilang: ' + type);
  const obj = {};
  for(const f of flds){
    if(f.isArr){
      let n = f.arrLen;
      if(n < 0){ n = dv.getUint32(p,true); p += 4; }
      if(f.type === 'uint8' || f.type === 'char' || f.type === 'byte'){
        obj[f.name] = u8.subarray(p, p+n); p += n;            // biner mentah (gambar/peta)
      } else if(PSIZE[f.type]){
        const arr = new Array(n);
        for(let k=0;k<n;k++){ const r = readPrim(dv,u8,p,f.type); arr[k] = r[0]; p = r[1]; }
        obj[f.name] = arr;
      } else {
        const arr = new Array(n);
        for(let k=0;k<n;k++){ const r = deser(dv,u8,p,f.type,defs); arr[k] = r[0]; p = r[1]; }
        obj[f.name] = arr;
      }
    } else {
      const r = deser(dv, u8, p, f.type, defs); obj[f.name] = r[0]; p = r[1];
    }
  }
  return [obj, p];
}
// topic berat yang tidak dipakai panel mana pun — dilewati supaya hemat memori
const SKIP = t => t === '/tf' || t === '/tf_static' || t.includes('points')
  || t.includes('costmap') || t.includes('depth_camera') || t.includes('dwa_candidate');

function readBag(buffer){
  const u8 = new Uint8Array(buffer), dv = new DataView(buffer);
  // baris pertama harus "#ROSBAG V2.0" - kalau tidak, file ini bukan bag ROS1
  const magic = TD.decode(u8.subarray(0, 13));
  if(!magic.startsWith('#ROSBAG V2.0'))
    throw new Error('file ini bukan bag ROS1' +
      (magic.startsWith('#ROSBAG') ? ' versi 2.0 (terbaca "' + magic.trim() + '")' : ''));
  let p = 0; while(p < u8.length && u8[p] !== 10) p++; p++;
  const conns = {}, msgs = [];
  let tMin = Infinity, tMax = -Infinity, truncated = false;
  function inner(buf){
    const idv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    let q = 0;
    while(q + 4 <= buf.length){
      try{
      const hl = idv.getUint32(q,true); q += 4;
      const f = fields(buf, idv, q, q+hl); q += hl;
      const dl = idv.getUint32(q,true); q += 4;
      const op = f.op[0];
      if(op === 7){
        const id = u32(f.conn), cf = fields(buf, idv, q, q+dl);
        conns[id] = {id, topic:TD.decode(f.topic), type:TD.decode(cf.type),
                     def:TD.decode(cf.message_definition), count:0};
      } else if(op === 2){
        const id = u32(f.conn), c = conns[id];
        if(c){
          c.count++;
          if(!SKIP(c.topic)){
            const t = u32(f.time.subarray(0,4)) + u32(f.time.subarray(4,8))/1e9;
            if(t < tMin) tMin = t; if(t > tMax) tMax = t;
            msgs.push({id, t, dv:idv, u8:buf, off:q});
          }
        }
      }
      q += dl;
      }catch(err){ truncated = true; return; }   // chunk terpotong: simpan yang sempat terbaca
    }
  }
  while(p + 4 <= u8.length){
    try{
    const hl = dv.getUint32(p,true); p += 4;
    const f = fields(u8, dv, p, p+hl); p += hl;
    const dl = dv.getUint32(p,true); p += 4;
    const op = f.op[0];
    if(op === 5){
      const comp = TD.decode(f.compression), size = u32(f.size);
      if(comp !== 'none' && comp !== 'lz4')
        throw new Error('kompresi "' + comp + '" belum didukung portal ini. ' +
          'Minta vendor merekam dengan lz4 atau tanpa kompresi, ' +
          'atau konversi lebih dulu: rosbag decompress namafile.bag');
      const raw = u8.subarray(p, p+dl);
      inner(comp === 'none' ? raw : lz4Frame(raw, size));
    } else if(op === 7){
      const id = u32(f.conn), cf = fields(u8, dv, p, p+dl);
      conns[id] = {id, topic:TD.decode(f.topic), type:TD.decode(cf.type),
                   def:TD.decode(cf.message_definition), count:(conns[id]||{}).count||0};
    }
    p += dl;
    }catch(err){
      if(/belum didukung/.test(err.message)) throw err;   // kompresi: harus dilaporkan apa adanya
      truncated = true; break;                            // sisanya: pakai bagian yang utuh
    }
  }
  for(const id in conns) conns[id].defs = parseDefs(conns[id].def, conns[id].type);
  msgs.sort((a,b) => a.t - b.t);
  if(!msgs.length) throw new Error('tidak ada pesan yang bisa dibaca di file ini');
  return {conns, msgs, t0:tMin, t1:tMax, truncated};
}

/* =======================================================================
   BAGIAN 2 — Analisis: ubah pesan mentah jadi temuan
   ======================================================================= */
const V_MOVING = 0.05;          // m/s, ambang "bergerak"
const IDLE_MIN = 15;            // detik, ambang blok diam yang dilaporkan
let B = null;                   // bag terparsir
let A = null;                   // hasil analisis
let camUrls = [];               // object URL frame kamera

function dec(m){ const c = B.conns[m.id]; return deser(m.dv, m.u8, m.off, c.type, c.defs)[0]; }
function topicMsgs(t){ return B.msgs.filter(m => B.conns[m.id].topic === t); }

function analyse(fileName){
  const rel = m => m.t - B.t0;
  const dur = B.t1 - B.t0;

  // --- rute (frame peta) ---
  let pose = topicMsgs('/tracked_pose/low_frequency');
  if(pose.length < 2) pose = topicMsgs('/fused_odom');
  const path = pose.map(m => { const d = dec(m); return {t:rel(m), x:d.pose.pose.position.x, y:d.pose.pose.position.y}; });

  // --- jarak & utilisasi dari posisi ---
  let dist = 0, moving = 0; const idle = [];
  let cur = null;
  for(let i=1;i<path.length;i++){
    const dt = path[i].t - path[i-1].t; if(dt <= 0) continue;
    const d = Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y);
    dist += d;
    if(d/dt > V_MOVING){ moving += dt; if(cur && cur[1]-cur[0] > IDLE_MIN) idle.push(cur); cur = null; }
    else { cur = cur ? [cur[0], path[i].t] : [path[i-1].t, path[i].t]; }
  }
  if(cur && cur[1]-cur[0] > IDLE_MIN) idle.push(cur);

  // --- kecepatan dari encoder roda (bukan turunan posisi: pose melompat saat relokalisasi) ---
  const speed = topicMsgs('/wheel_control/wheel_state').map(m => {
    const d = dec(m); return {t:rel(m), v:Math.abs((d.speed_left + d.speed_right)/2), estop:d.emergency_stop_pressed};
  });
  const vm = speed.filter(s => s.v > V_MOVING).map(s => s.v).sort((a,b)=>a-b);
  const mean = vm.length ? vm.reduce((a,b)=>a+b,0)/vm.length : 0;
  const p95 = vm.length ? vm[Math.floor(.95*vm.length)] : 0;

  // --- kejadian ---
  const ev = [];
  topicMsgs('/all_actions').forEach(m => { const d = dec(m); ev.push({t:rel(m), kind:'aksi', txt:d.action + ' — ' + d.message}); });
  let lastPoi = null;
  topicMsgs('/planning_intent').forEach(m => { const d = dec(m);
    if(d.poi_name && d.poi_name !== lastPoi){ ev.push({t:rel(m), kind:'tujuan', txt:'menuju POI "' + d.poi_name + '"'}); lastPoi = d.poi_name; }});
  let jackMax = 0;
  topicMsgs('/jack_state').forEach(m => { const d = dec(m);
    jackMax = Math.max(jackMax, d.weight);
    if(d.progress === 1 && d.weight > 0) ev.push({t:rel(m), kind:'jack', txt:'angkat selesai, beban terbaca ' + d.weight.toFixed(1) + ' kg'});
    if(d.error_code) ev.push({t:rel(m), kind:'error', txt:'jack error ' + d.error_code + ' ' + d.error_message});
  });
  topicMsgs('/alerts').forEach(m => (dec(m).alerts||[]).forEach(a =>
    ev.push({t:rel(m), kind:a.level >= 2 ? 'error' : 'peringatan', txt:'kode ' + a.code + ': ' + a.msg})));
  topicMsgs('/events').forEach(m => { const d = dec(m);
    ev.push({t:rel(m), kind:d.level >= 2 ? 'error' : 'peringatan', txt:'[' + d.part + '] kode ' + d.code + ': ' + d.message}); });
  ev.sort((a,b) => a.t - b.t);
  // /alerts dan /events sering melaporkan kejadian yang sama - buang duplikatnya
  const seen = new Set(), ded = [];
  for(const e of ev){
    const key = Math.round(e.t*2) + '|' + e.kind + '|' + e.txt.replace(/^\[[^\]]+\]\s*/,'');
    if(seen.has(key)) continue;
    seen.add(key); ded.push(e);
  }
  ev.length = 0; ev.push(...ded);

  // --- log node ---
  const LV = {2:'DEBUG',4:'INFO',8:'WARN',16:'ERROR',32:'FATAL'};
  const logs = [];
  topicMsgs('/rosout').forEach(m => { const d = dec(m);
    if(d.level >= 8) logs.push({t:rel(m), lvl:LV[d.level]||d.level, node:d.name, msg:d.msg}); });
  logs.sort((a,b) => a.t - b.t);

  // --- kamera ---
  const cam = topicMsgs('/rgb_cameras/front/compressed').map(m => {
    const d = dec(m);
    return {t:rel(m), blob:new Blob([d.data.slice()], {type:'image/' + (d.format || 'jpeg')})};
  });

  // --- peta ---
  let map = null;
  const mi = topicMsgs('/map_image');
  if(mi.length){
    const d = dec(mi[0]);
    map = {w:d.width, h:d.height, res:d.resolution, ox:d.origin.position.x, oy:d.origin.position.y,
           blob:new Blob([d.data.slice()], {type:'image/png'})};
  }
  let mapName = '';
  const info = topicMsgs('/map/info'); if(info.length) mapName = dec(info[0]).name;

  // --- baterai ---
  let batt = null;
  const bs = topicMsgs('/battery_state');
  if(bs.length){ const a = dec(bs[0]), z = dec(bs[bs.length-1]);
    batt = {soc0:a.percentage*100, soc1:z.percentage*100, v0:a.voltage, v1:z.voltage,
            cycles:z.cycle_count, soh:z.state_of_health}; }

  // --- vonis: apakah task selesai? ---
  const fault = ev.filter(e => e.kind === 'error');
  const stuckLate = idle.some(([a,b]) => b > dur - 30 && b - a > 30);
  const status = fault.length ? 'gagal' : (stuckLate ? 'menggantung' : 'bersih');

  // --- topic ---
  const tp = Object.values(B.conns).reduce((acc,c) => {
    acc[c.topic] = {n:(acc[c.topic]?.n||0)+c.count, type:c.type}; return acc; }, {});

  return {fileName, truncated:B.truncated, dur, path, dist, moving, idle, speed, mean, p95,
          vmax:vm.length?vm[vm.length-1]:0, ev, logs, cam, map, mapName, batt,
          jackMax, status, fault, tp, epoch:B.t0};
}

/* =======================================================================
   BAGIAN 2b — Arsip lintas file: ledger kejadian + register CAPA
   Disimpan di browser (localStorage) DAN bisa diekspor sebagai berkas JSON
   supaya bisa ditaruh di shared drive dan dibaca orang lain.
   ======================================================================= */
const K_ARSIP = 'amr2_bag_arsip_v1', K_CAPA = 'amr2_capa_v1';
let simpanAktif = true;
function simpan(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ simpanAktif = false; return false; }
}
function ambil(k, d){
  try{ const t = localStorage.getItem(k); return t ? JSON.parse(t) : d; }
  catch(e){ simpanAktif = false; return d; }
}
let arsip = ambil(K_ARSIP, []), capa = ambil(K_CAPA, []);
// pindahkan data lama dari versi portal mandiri (awalan amr_) sekali saja
(function(){
  try{
    [[K_ARSIP,'amr_bag_arsip_v1'],[K_CAPA,'amr_capa_v1']].forEach(([baru,lama]) => {
      if(!localStorage.getItem(baru) && localStorage.getItem(lama))
        localStorage.setItem(baru, localStorage.getItem(lama));
    });
    arsip = ambil(K_ARSIP, arsip); capa = ambil(K_CAPA, capa);
  }catch(e){}
})();

function ringkasSesi(){
  const kd = e => (e.txt.match(/kode (\d+)/) || [])[1] || '';
  const pos = t => { const p = poseAt(t); return p ? {x:+p.x.toFixed(2), y:+p.y.toFixed(2)} : {x:null, y:null}; };
  return {
    // kunci: unit + waktu mulai, bukan nama file - file yang di-rename tidak terhitung dua kali
    id: ((A.fileName.match(/^([A-Za-z0-9]+)_/) || [])[1] || '-') + '|' + Math.round(A.epoch),
    file: A.fileName,
    unit: (A.fileName.match(/^([A-Za-z0-9]+)_/) || [])[1] || '-',
    peta: A.mapName || '-',
    mulai: A.epoch, dur: A.dur, jarak: +A.dist.toFixed(1),
    gerak: +(A.moving / A.dur).toFixed(3), vmean: +A.mean.toFixed(2),
    jack: +A.jackMax.toFixed(1), status: A.status, terpotong: !!A.truncated,
    kejadian: A.ev.filter(e => e.kind === 'error' || e.kind === 'peringatan')
      .map(e => Object.assign({t:+e.t.toFixed(1), jenis:e.kind, kode:kd(e), txt:e.txt}, pos(e.t))),
    macet: A.idle.filter(([a,b]) => A.ev.some(e => e.t >= a && e.t <= b &&
        (e.kind === 'error' || e.kind === 'peringatan')))
      .map(([a,b]) => Object.assign({mulai:Math.round(a), selesai:Math.round(b), lama:Math.round(b-a)}, pos(b)))
  };
}
function simpanSesi(){
  const r = ringkasSesi();
  const i = arsip.findIndex(x => x.id === r.id);
  if(i >= 0) arsip[i] = r; else arsip.push(r);       // file sama tidak dihitung dua kali
  arsip.sort((a,b) => a.mulai - b.mulai);
  simpan(K_ARSIP, arsip);
}
// Kelompokkan kejadian berdasarkan kedekatan lokasi (radius 3 m) -> titik rawan
function titikRawan(peta){
  const cl = [];
  arsip.filter(s => !peta || s.peta === peta).forEach(s => {
    const semua = s.kejadian.filter(k => k.x !== null)
      .concat(s.macet.filter(m => m.x !== null).map(m => ({x:m.x, y:m.y, kode:'diam', txt:'macet ' + m.lama + ' dtk'})));
    semua.forEach(k => {
      let c = cl.find(c => Math.hypot(c.x - k.x, c.y - k.y) <= 3);
      if(!c){ c = {x:k.x, y:k.y, n:0, sesi:new Set(), kode:new Set(), unit:new Set()}; cl.push(c); }
      c.n++; c.sesi.add(s.id); c.unit.add(s.unit); if(k.kode) c.kode.add(k.kode);
      c.x = (c.x * (c.n - 1) + k.x) / c.n; c.y = (c.y * (c.n - 1) + k.y) / c.n;
    });
  });
  return cl.sort((a,b) => b.sesi.size - a.sesi.size || b.n - a.n);
}
function unduh(nama, isi, tipe){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([isi], {type:tipe}));
  a.download = nama; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function csvKejadian(){
  const baris = [['file','unit','tanggal_utc','detik','jenis','kode','x','y','keterangan']];
  arsip.forEach(s => s.kejadian.forEach(k => baris.push([
    s.file, s.unit, new Date(s.mulai * 1000).toISOString().slice(0,16).replace('T',' '),
    k.t, k.jenis, k.kode, k.x, k.y, '"' + String(k.txt).replace(/"/g,'""') + '"'])));
  return baris.map(r => r.join(',')).join('\n');
}
function csvCapa(){
  const baris = [['titik','temuan','akar_masalah','korektif','preventif','pic','target','status','dibuat']];
  capa.forEach(c => baris.push([c.titik, c.temuan, c.akar, c.korektif, c.preventif, c.pic, c.target, c.status, c.dibuat]
    .map(v => '"' + String(v||'').replace(/"/g,'""') + '"')));
  return baris.map(r => r.join(',')).join('\n');
}

/* =======================================================================
   BAGIAN 3 — Tampilan
   ======================================================================= */
const $ = s => root.querySelector(s);
let tNow = 0, mapImg = null, camIdx = -1;

function fmtT(s){ const m = Math.floor(s/60); return m + ':' + String(Math.floor(s%60)).padStart(2,'0'); }

function renderVerdict(){
  const badge = {gagal:['bad','Task gagal'], menggantung:['warn','Task menggantung'], bersih:['good','Tanpa alert']}[A.status];
  $('#ab-verdict').innerHTML =
    '<span class="badge ' + badge[0] + '">' + badge[1] + '</span>' +
    (A.truncated ? '<span class="badge warn">File terpotong</span>' : '') +
    kpi(A.dist.toFixed(0) + ' m', 'jarak tempuh') +
    kpi(Math.round(A.moving/A.dur*100) + '%', 'waktu bergerak') +
    kpi(A.mean.toFixed(2) + ' m/s', 'kecepatan rata-rata jalan') +
    kpi(A.jackMax.toFixed(1) + ' kg', 'beban terangkat maksimum') +
    kpi(A.fault.length, 'error') +
    kpi(A.logs.length, 'log WARN ke atas') +
    (A.batt ? kpi(A.batt.soc0.toFixed(0) + '→' + A.batt.soc1.toFixed(0) + '%', 'baterai') : '');
}
const kpi = (b, s) => '<div class="kpi"><b>' + b + '</b><span>' + s + '</span></div>';

function drawMap(){
  const cv = $('#ab-map'), wrap = $('#ab-mapwrap');
  const W = wrap.clientWidth, H = wrap.clientHeight;
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,W,H);
  if(!A.path.length) return;

  // kotak pandang: rute + margin 10 m
  const xs = A.path.map(p=>p.x), ys = A.path.map(p=>p.y), pad = 10;
  const bx0 = Math.min(...xs)-pad, bx1 = Math.max(...xs)+pad;
  const by0 = Math.min(...ys)-pad, by1 = Math.max(...ys)+pad;
  const sc = Math.min(W/(bx1-bx0), H/(by1-by0));
  const offX = (W - (bx1-bx0)*sc)/2, offY = (H - (by1-by0)*sc)/2;
  const X = x => (x-bx0)*sc + offX;
  const Y = y => H - ((y-by0)*sc + offY);

  if(mapImg && A.map){                       // latar peta gudang asli dari log
    const m = A.map;
    const sx = (bx0 - m.ox)/m.res, sy = m.h - (by1 - m.oy)/m.res;
    const sw = (bx1-bx0)/m.res, sh = (by1-by0)/m.res;
    ctx.globalAlpha = .55;
    ctx.drawImage(mapImg, sx, sy, sw, sh, offX, offY, (bx1-bx0)*sc, (by1-by0)*sc);
    ctx.globalAlpha = 1;
  }
  // rute: yang sudah dilewati pekat, sisanya tipis
  ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(21,96,122,.25)';
  ctx.beginPath(); A.path.forEach((p,i) => i ? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y))); ctx.stroke();
  ctx.strokeStyle = '#15607A';
  ctx.beginPath();
  A.path.filter(p => p.t <= tNow).forEach((p,i) => i ? ctx.lineTo(X(p.x),Y(p.y)) : ctx.moveTo(X(p.x),Y(p.y)));
  ctx.stroke();

  // penanda kejadian penting
  A.ev.filter(e => e.kind === 'error' || e.kind === 'peringatan' || e.kind === 'jack').forEach(e => {
    const p = poseAt(e.t); if(!p) return;
    ctx.fillStyle = e.kind === 'error' ? '#A32E26' : e.kind === 'jack' ? '#3F7A4B' : '#B8791A';
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
  // titik rawan dari sesi LAIN pada peta yang sama - cincin kuning berongga
  titikRawan(A.mapName).forEach(c => {
    if(c.sesi.size < 2) return;   // cincin hanya untuk titik yang berulang di lebih dari satu sesi
    ctx.strokeStyle = '#B8791A'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(X(c.x), Y(c.y), 11, 0, 7); ctx.stroke();
    ctx.fillStyle = '#B8791A'; ctx.font = '11px system-ui';
    ctx.fillText(c.sesi.size + '×', X(c.x) + 13, Y(c.y) + 4);
  });

  // posisi robot sekarang
  const r = poseAt(tNow);
  if(r){
    ctx.fillStyle = '#1C2226';
    ctx.beginPath(); ctx.arc(X(r.x), Y(r.y), 7, 0, 7); ctx.fill();
    ctx.strokeStyle = '#F5F4F0'; ctx.lineWidth = 2.5; ctx.stroke();
  }
  // skala
  ctx.strokeStyle = '#1C2226'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W-90, H-22); ctx.lineTo(W-90+10*sc, H-22); ctx.stroke();
  ctx.fillStyle = '#1C2226'; ctx.font = '12px system-ui';
  ctx.fillText('10 m', W-88, H-28);
  $('#ab-maplabel').textContent = (A.mapName ? 'peta ' + A.mapName + ' · ' : '') +
    (r ? 'posisi ' + r.x.toFixed(1) + ', ' + r.y.toFixed(1) : '');
}
function poseAt(t){
  if(!A.path.length) return null;
  let lo = 0, hi = A.path.length-1;
  while(lo < hi){ const mid = (lo+hi)>>1; if(A.path[mid].t < t) lo = mid+1; else hi = mid; }
  return A.path[lo];
}

function showCam(){
  if(!A.cam.length){ $('#ab-camnote').textContent = 'tidak ada frame kamera di log ini'; return; }
  let i = 0;
  for(let k=0;k<A.cam.length;k++) if(A.cam[k].t <= tNow) i = k;
  if(i === camIdx) return;
  camIdx = i;
  $('#ab-cam').src = camUrls[i];
  $('#ab-camnote').textContent = 'kamera depan · frame ' + (i+1) + ' dari ' + A.cam.length +
    ' · detik ' + A.cam[i].t.toFixed(1);
}

function showState(){
  const rows = [];
  const near = (arr, f) => { let r = null; for(const a of arr) if(a.t <= tNow) r = a; return r ? f(r) : '—'; };
  rows.push(['waktu', fmtT(tNow) + ' (' + tNow.toFixed(1) + ' dtk)']);
  const p = poseAt(tNow);
  rows.push(['posisi peta', p ? p.x.toFixed(2) + ', ' + p.y.toFixed(2) : '—']);
  rows.push(['kecepatan', near(A.speed, s => s.v.toFixed(2) + ' m/s')]);
  const lastEv = A.ev.filter(e => e.t <= tNow).slice(-1)[0];
  rows.push(['kejadian terakhir', lastEv ? lastEv.txt.slice(0,60) : '—']);
  if(A.batt) rows.push(['baterai', A.batt.soc1.toFixed(0) + '% · ' + A.batt.cycles + ' siklus']);
  rows.push(['jam robot', new Date((A.epoch + tNow)*1000).toISOString().slice(11,19) + ' UTC']);
  $('#ab-state').innerHTML = rows.map(r => '<div><span>' + r[0] + '</span><span>' + r[1] + '</span></div>').join('');
}

function renderTicks(){
  const box = $('#ab-ticks'); box.innerHTML = '';
  A.ev.filter(e => e.kind === 'error' || e.kind === 'peringatan').forEach(e => {
    const i = document.createElement('i');
    i.style.left = (e.t/A.dur*100) + '%';
    if(e.kind === 'error') i.className = 'f';
    i.title = 'detik ' + e.t.toFixed(0) + ' — ' + e.txt;
    i.onclick = () => seek(e.t);
    box.appendChild(i);
  });
}

/* ---------- tab ---------- */
function tabFind(){
  const li = [];
  const pct = Math.round(A.moving/A.dur*100);
  if(A.truncated) li.push('<b style="color:var(--ab-warn)">File ini terpotong</b> — perekaman berhenti di tengah ' +
    '(robot dimatikan atau proses log terputus). Angka di bawah hanya berlaku untuk bagian yang terbaca.');
  li.push('Durasi log <b>' + fmtT(A.dur) + '</b>, jarak tempuh <b>' + A.dist.toFixed(1) + ' m</b>, ' +
          'robot bergerak <b>' + pct + '%</b> dari waktu itu.');
  li.push('Kecepatan saat bergerak: rata-rata <b>' + A.mean.toFixed(2) + '</b>, P95 ' + A.p95.toFixed(2) +
          ', maksimum ' + A.vmax.toFixed(2) + ' m/s. Pakai angka rata-rata untuk menguji asumsi cycle time, bukan angka brosur.');
  if(A.jackMax > 0) li.push('Beban terangkat maksimum <b>' + A.jackMax.toFixed(1) + ' kg</b>' +
      (A.jackMax < 100 ? ' — muatan ringan, jadi log ini belum menguji perilaku pada beban penuh.' : '.'));
  A.idle.forEach(([a,b]) => {
    const p = poseAt(b);
    const macet = A.ev.some(e => e.t >= a && e.t <= b && (e.kind === 'error' || e.kind === 'peringatan'));
    li.push((macet ? '<b>Macet ' : 'Diam <b>') + Math.round(b-a) + ' detik</b> (detik ' + Math.round(a) + '–' + Math.round(b) + ')' +
      (p ? ' di koordinat <b>' + p.x.toFixed(1) + ', ' + p.y.toFixed(1) + '</b>' : '') +
      (macet ? ' — ada alert di rentang ini. Cek titik koordinat tersebut di layout gudang.'
             : ' — tanpa alert, kemungkinan parkir atau menunggu perintah.'));
  });
  A.fault.forEach(e => li.push('<b style="color:var(--ab-fault)">Error detik ' + e.t.toFixed(0) + ':</b> ' + e.txt));
  if(!A.fault.length && !A.idle.length) li.push('Tidak ada error atau kemacetan pada periode ini.');
  const rep = {};
  A.logs.forEach(l => { const k = l.node + ': ' + l.msg.split('(')[0].slice(0,60); rep[k] = (rep[k]||0)+1; });
  const top = Object.entries(rep).sort((a,b)=>b[1]-a[1]).slice(0,3);
  top.forEach(([k,n]) => { if(n > 5) li.push('Log berulang <b>' + n + '×</b> — ' + k); });
  if(A.batt) li.push('Baterai ' + A.batt.soc0.toFixed(0) + '% → ' + A.batt.soc1.toFixed(0) +
    '%, siklus charge ke-' + A.batt.cycles + ' (indikasi seberapa sering unit dipakai).');
  const jam = new Date(A.epoch*1000);
  li.push('Jam internal robot: <b>' + jam.toISOString().slice(0,16).replace('T',' ') + ' UTC</b>. ' +
    'Cocokkan dengan nama file — kalau beda, zona waktu robot belum di-set WIB dan atribusi shift akan meleset.');
  return '<ul class="find">' + li.map(x => '<li>' + x + '</li>').join('') + '</ul>';
}
function tabTL(){
  const cls = {error:'f', peringatan:'w', aksi:'a', tujuan:'a', jack:''};
  return '<table><thead><tr><th style="width:70px">detik</th><th style="width:100px">jenis</th><th>kejadian</th><th style="width:130px">posisi</th></tr></thead><tbody>' +

function tabLog(){

  return '<table><thead><tr><th style="width:70px">detik</th><th style="width:70px">level</th><th style="width:130px">node</th><th>pesan</th></tr></thead><tbody>' +

function tabTP(){

function pasangArs(){
  const on = (id, fn) => { const el = document.getElementById('ab-' + id); if(el) el.onclick = fn; };
  const stamp = () => new Date().toISOString().slice(0,10);
  on('expEv', () => unduh('kejadian_amr.csv', csvKejadian(), 'text/csv'));
  on('expCapa', () => unduh('capa_amr.csv', csvCapa(), 'text/csv'));
  on('expArs', () => unduh('arsip_amr_' + stamp() + '.json',
        JSON.stringify({arsip, capa}, null, 1), 'application/json'));
  on('impArs', () => document.getElementById('ab-fileArs').click());
  on('delArs', () => { if(confirm('Hapus seluruh riwayat dan CAPA di browser ini? Ekspor dulu kalau belum.')){
        arsip = []; capa = []; simpan(K_ARSIP, arsip); simpan(K_CAPA, capa); renderTab(); } });
  const fi = document.getElementById('ab-fileArs');
  if(fi) fi.onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      (d.arsip||[]).forEach(s => { if(!arsip.some(x => x.id === s.id)) arsip.push(s); });
      (d.capa||[]).forEach(c => { if(!capa.some(x => x.dibuat === c.dibuat && x.temuan === c.temuan)) capa.push(c); });
      arsip.sort((a,b) => a.mulai - b.mulai);
      simpan(K_ARSIP, arsip); simpan(K_CAPA, capa); renderTab();
    }catch(err){ alert('Berkas arsip tidak terbaca: ' + err.message); }
  };
  on('cSave', () => {
    const v = id => { const el = document.getElementById('ab-' + id); return el ? el.value.trim() : ''; };
    if(!v('cTemuan')){ alert('Isi temuan dulu.'); return; }
    capa.push({titik:v('cTitik'), temuan:v('cTemuan'), akar:v('cAkar'), korektif:v('cKor'),
               preventif:v('cPre'), pic:v('cPic'), target:v('cTgt'), status:v('cSt'), dibuat:new Date().toISOString()});
    simpan(K_CAPA, capa); renderTab();
  });
  root.querySelectorAll('.capaNext').forEach(b => b.onclick = () => {
    const urut = ['buka','jalan','tutup'], c = capa[+b.dataset.i];
    c.status = urut[(urut.indexOf(c.status) + 1) % 3];
    simpan(K_CAPA, capa); renderTab();
  });
}
function drawChart(){
  const cv = $('#ab-chart'); if(!cv) return;
  const W = cv.clientWidth, H = 210;
  cv.width = W*devicePixelRatio; cv.height = H*devicePixelRatio;
  cv.style.height = H + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,W,H);
  const L = 44, Bm = 24, vmax = Math.max(1, A.vmax*1.15);
  const X = t => L + t/A.dur*(W-L-10);
  const Y = v => H-Bm - v/vmax*(H-Bm-12);
  ctx.strokeStyle = '#C9C6BD'; ctx.fillStyle = '#6B7480'; ctx.font = '11px system-ui'; ctx.lineWidth = 1;
  for(let k=0;k<=4;k++){ const v = vmax*k/4;
    ctx.beginPath(); ctx.moveTo(L,Y(v)); ctx.lineTo(W-10,Y(v)); ctx.stroke();
    ctx.fillText(v.toFixed(1), 6, Y(v)+4); }
  ctx.fillText('m/s', 6, 12);
  for(let t=0;t<=A.dur;t+=60){ ctx.fillText(fmtT(t), X(t)-12, H-6); }
  // blok diam
  ctx.fillStyle = 'rgba(184,121,26,.15)';
  A.idle.forEach(([a,b]) => ctx.fillRect(X(a), 12, X(b)-X(a), H-Bm-12));
  // garis kecepatan
  ctx.strokeStyle = '#15607A'; ctx.lineWidth = 1.5; ctx.beginPath();
  A.speed.forEach((s,i) => i ? ctx.lineTo(X(s.t), Y(s.v)) : ctx.moveTo(X(s.t), Y(s.v)));
  ctx.stroke();
  // penanda error
  A.ev.filter(e => e.kind === 'error').forEach(e => {
    ctx.strokeStyle = '#A32E26'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(e.t), 12); ctx.lineTo(X(e.t), H-Bm); ctx.stroke(); });
  // kursor waktu
  ctx.strokeStyle = '#1C2226'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(tNow), 12); ctx.lineTo(X(tNow), H-Bm); ctx.stroke();
  cv.onclick = ev => { const r = cv.getBoundingClientRect();
    seek((ev.clientX - r.left - L)/(W-L-10)*A.dur); };
}

async function load(file){
  $('#ab-status').textContent = 'membaca ' + file.name + ' (' + (file.size/1048576).toFixed(1) + ' MB)…';
  await new Promise(r => setTimeout(r, 30));
  try{
    if(file.size > 200 * 1048576)
      $('#ab-status').textContent = 'file ' + (file.size/1048576).toFixed(0) +
        ' MB — pemrosesan bisa lebih dari satu menit dan tab akan terasa membeku…';
    const buf = await file.arrayBuffer();
    $('#ab-status').textContent = 'membuka isi log…';
    await new Promise(r => setTimeout(r, 30));
    const t = performance.now();
    B = readBag(buf);
    A = analyse(file.name);
    camUrls.forEach(URL.revokeObjectURL);
    camUrls = A.cam.map(c => URL.createObjectURL(c.blob));
    mapImg = null;
    if(A.map){
      mapImg = await createImageBitmap(A.map.blob).catch(() => null);
    }
    $('#ab-drop').style.display = 'none';
    $('#ab-app').style.display = 'flex';
    $('#ab-btnNew').classList.remove('hide');
    $('#ab-btnCopy').classList.remove('hide');
    root.querySelector('.ab-head .sub').textContent =
      file.name + ' · ' + fmtT(A.dur) + ' · terbaca dalam ' + Math.round(performance.now()-t) + ' ms';
    $('#ab-time').max = A.dur; $('#ab-tend').textContent = fmtT(A.dur);
    simpanSesi();
    renderVerdict(); renderTicks(); renderTab();
    seek(0);
  }catch(err){
    $('#ab-status').textContent = 'Gagal membaca: ' + err.message +
      '. Pastikan ini file .bag ROS1 dari robot, bukan hasil konversi.';
    console.error(err);
  }
}
function ringkasanTeks(){
  const L = [];
  L.push('RINGKASAN LOG AMR — ' + A.fileName);
  L.push('Durasi ' + fmtT(A.dur) + ' | jarak ' + A.dist.toFixed(1) + ' m | bergerak ' +
    Math.round(A.moving/A.dur*100) + '% | v rata-rata ' + A.mean.toFixed(2) + ' m/s | beban maks ' + A.jackMax.toFixed(1) + ' kg');
  L.push('Status: ' + A.status);
  L.push('');
  L.push('KEJADIAN:');
  A.ev.forEach(e => { const p = poseAt(e.t);
    L.push('  ' + e.t.toFixed(1).padStart(6) + ' dtk [' + e.kind + '] ' + e.txt +
      (p ? '  @ (' + p.x.toFixed(1) + ', ' + p.y.toFixed(1) + ')' : '')); });
  if(A.idle.length){
    L.push(''); L.push('BLOK DIAM > ' + IDLE_MIN + ' DETIK:');
    A.idle.forEach(([a,b]) => { const p = poseAt(b);
      L.push('  detik ' + Math.round(a) + '–' + Math.round(b) + ' (' + Math.round(b-a) + ' dtk)' +
        (p ? '  @ (' + p.x.toFixed(1) + ', ' + p.y.toFixed(1) + ')' : '')); });
  }
  return L.join('\n');
}

function line(id){return LINES.find(l=>l.id===id);}
function bld(id){return BUILDINGS.find(b=>b.id===id);}
function linesOf(bId){return LINES.filter(l=>l.bld===bId);}

function pid(l,t){return l.id+'-'+PTYPE[t].short;}

function destOf(l,t,mode){

    ? {code:`TS-${l.id}-${s}`, label:`Titik Supply ${PTYPE[t].label} @ ${l.name}`, where:'di line'}

const TITLES = {dashboard:'Dashboard', wo:'Antrian Work Order', orders:'Orders — Riwayat Panggilan',
  matrix:'Matriks Harmonisasi', robots:'Robots', logs:'Activity Logs', pic:'Panggil AMR',
  areas:'Areas', maps:'Maps', machines:'Machines', tasks:'Tasks', users:'Users', sessions:'Sessions', baglog:'Analisa Log AMR'};
const PARENT = {areas:'Fleet',robots:'Fleet',maps:'Fleet',machines:'Fleet',orders:'Fleet',tasks:'Fleet',
  users:'Administration',sessions:'Administration',logs:'Administration',baglog:'Fleet'};
function titleOf(id){
  if(id.startsWith('bld-')){const b=bld(id.slice(4));return b?b.name:'—';}
  if(id.startsWith('mon-')){const b=bld(id.slice(4));return b?'Monitor '+b.name:'—';}
  if(id.startsWith('line-')){const l=line(id.slice(5));return l?l.name:'—';}
  return TITLES[id]||'Dashboard';
}
function route(){
  const id=curPage();
  stopMap();                       /* cegah RAF loop menumpuk antar halaman */
  if(window.AMRBag) AMRBag.unmount();   /* lepas modul analisa log */
  renderNav();
  const bc=document.getElementById('breadcrumb');
  let crumb=`<span>Home</span>`;
  const grp = id.startsWith('bld-')?'Papan Supply'
            : id.startsWith('mon-')?'Area Monitor'
            : id.startsWith('line-')?'Machine Call'
            : PARENT[id];
  if(grp) crumb+=`<span class="sep">${svgS('chevR',14)}</span><span>${esc(grp)}</span>`;
  crumb+=`<span class="sep">${svgS('chevR',14)}</span><span class="cur">${esc(titleOf(id))}</span>`;
  bc.innerHTML=crumb;
  const view=document.getElementById('view');
  let html;
  if(id.startsWith('bld-'))       html=PAGES.building(id.slice(4));
  else if(id.startsWith('mon-'))  html=PAGES.monitor(id.slice(4));
  else if(id.startsWith('line-')) html=PAGES.lineCall(id.slice(5));
  else html=(PAGES[id]||PAGES.dashboard)();
  view.innerHTML=html;
  if(id.startsWith('mon-')) startMap(id.slice(4));
  if(id==='baglog') AMRBag.mount(document.getElementById('ab-host'));
  window.scrollTo(0,0);
}

/* =====================================================================
   DISPATCH — inti "system call"
   ===================================================================== */
const inFlight={};
function callAMR(lineId,type,opts){
  opts=opts||{};
  const l=line(lineId), m=modeOf(l.bld), key=pid(l,type);
  if(inFlight[key]){toast('Panggilan untuk titik ini sedang diproses');return;}
  inFlight[key]=true; setTimeout(()=>{delete inFlight[key];},4000);

  const wo=activeWO(lineId);
  const d=destOf(l,type,m);
  const robots=DB.get('robots',[]).filter(r=>r.bld===l.bld && r.status==='online');
  const r=role();
  const order={
    id:'ORD-'+Date.now().toString().slice(-8),
    ts:new Date().toLocaleString('id-ID'),
    mode:m, flow:(m==='NEXT'?'PULL':'PUSH'),
    bld:l.bld, lineId:l.id, lineName:l.name,
    type, material:PTYPE[type].mat,
    destCode:d.code, destLabel:d.label,
    wo: wo?wo.id:'—', sku: wo?wo.sku:(l.sku||'—'),
    robot: robots.length?robots[0].sn:'BELUM ADA ROBOT',
    status: robots.length?'ASSIGNED':'PENDING',
    by: r.name
  };
  const list=DB.get('orders',[]); list.unshift(order); DB.set('orders',list);
  setPoint(key,{calling:true,last:order.ts});
  logIt(`${order.flow} · ${l.name} · ${PTYPE[type].label} → ${d.code} (${order.wo}) oleh ${r.name}`);
  toast(`${order.flow} terkirim — ${l.name} · ${PTYPE[type].label} → ${d.code}`);

  /* simulasi robot tiba: status titik kembali AMAN */
  setTimeout(()=>{
    setPoint(key,{calling:false,stock:'OK',qty:2});
    const ls=DB.get('orders',[]); const o=ls.find(x=>x.id===order.id);
    if(o){o.status='DELIVERED';DB.set('orders',ls);}
    if(document.getElementById('view')) route();
  }, 6000);
  route();
}
function setStock(lineId,type,val){
  setPoint(pid(line(lineId),type),{stock:val,qty:val==='OK'?2:(val==='LOW'?1:0)});
  route();
}
function logIt(msg){
  const l=DB.get('logs',[]);
  l.unshift({time:new Date().toLocaleString('id-ID'),user:role().name,msg});
  DB.set('logs',l.slice(0,200));
}

PAGES.dashboard=function(){
  const st=pstate(), orders=DB.get('orders',[]);
  const pts=allPoints();
  const empty=pts.filter(p=>(st[p.id]||{}).stock==='EMPTY');
  const low=pts.filter(p=>(st[p.id]||{}).stock==='LOW');
  const nextCount=BUILDINGS.filter(b=>modeOf(b.id)==='NEXT').length;
  const openOrd=orders.filter(o=>o.status!=='DELIVERED').length;

  const warn = statusBanner();

  const bldCards = BUILDINGS.map(b=>{
    const m=modeOf(b.id), ls=linesOf(b.id);
    const np=ls.reduce((a,l)=>a+pointsOf(l).length,0);
    const bad=ls.flatMap(l=>pointsOf(l).map(t=>st[pid(l,t)]||{})).filter(s=>s.stock==='EMPTY').length;
    return `<div class="bld-banner" style="margin-bottom:12px">
      <div class="bico">${svg('building')}</div>
      <div class="grow">
        <h2>${esc(b.name)}</h2>
        <div class="sub">${esc(b.desc)} · ${ls.length} line · ${np} titik supply${bad?` · <b style="color:var(--red)">${bad} kosong</b>`:''}</div>
      </div>
      ${modePill(m)} ${flowTag(m)}
      <button class="btn btn-ghost" onclick="go('bld-${b.id}')">Buka papan ${svgS('arrow',15)}</button>
    </div>`;
  }).join('');

  const audit=selfCheckMenus();
  const auditBox = (audit.missing.length||audit.noPage.length)
    ? alertBox('warn','warn',`<b>Peringatan integritas menu.</b> Menu berikut terdaftar di MENU_REGISTRY tapi tidak tersedia: ${esc([...audit.missing,...audit.noPage].map(m=>m.label).join(', '))}. Kembalikan sebelum rilis.`)
    : alertBox('info','check',`<b>Integritas menu OK.</b> Seluruh ${MENU_REGISTRY.length} menu terdaftar (${MENU_REGISTRY.filter(m=>m.origin==='v1').length} warisan portal v1 + ${MENU_REGISTRY.filter(m=>m.origin==='v2').length} baru) tersedia dan punya halaman.`);

  return head('Dashboard Supply','',
    `<button class="btn btn-ghost" onclick="resetAll()">${svg('refresh')} Reset demo</button>`)
  + warn + auditBox
  + `<div class="kpi-row">
      <div class="kpi"><div class="t">${svg('building')}Gedung</div><div class="n">3</div><div class="c">A · G · F</div></div>
      <div class="kpi"><div class="t">${svg('board')}Line</div><div class="n">${LINES.length}</div><div class="c">7 Assembly · 2 Charging</div></div>
      <div class="kpi"><div class="t">${svg('pin')}Titik supply</div><div class="n">${pts.length}</div><div class="c">7×3 Assy + 2×1 Charging</div></div>
      <div class="kpi"><div class="t">${svg('bolt')}Gedung mode NEXT</div><div class="n">${nextCount}/3</div><div class="c">sisanya masih EXISTING</div></div>
      <div class="kpi"><div class="t">${svg('warn')}Titik kosong / menipis</div><div class="n" style="color:${empty.length?'var(--red)':(low.length?'var(--amber)':'var(--green)')}">${empty.length} / ${low.length}</div><div class="c">butuh tindakan</div></div>
      <div class="kpi"><div class="t">${svg('truck')}Panggilan aktif</div><div class="n">${openOrd}</div><div class="c">dari ${orders.length} total</div></div>
    </div>`
  + `<div class="sec">${svg('building')}Papan per gedung</div>`
  + bldCards
  + `<div class="sec">${svg('orders')}Panggilan terakhir</div>`
  + ordersTable(DB.get('orders',[]).slice(0,6));
};

/* ---------- PAPAN SUPPLY PER GEDUNG ---------- */
PAGES.building=function(bId){
  const b=bld(bId); if(!b) return PAGES.dashboard();
  const m=modeOf(bId), st=pstate(), r=role();
  const canPush = m==='EXISTING' && (r.kind==='ADMIN'||r.kind==='WH');
  const canPull = m==='NEXT'     && (r.kind==='ADMIN'||r.kind==='PIC');

  const banner=`<div class="bld-banner">
    <div class="bico">${svg('building')}</div>
    <div class="grow">
      <h2>${esc(b.name)}</h2>
      <div class="sub">${esc(b.desc)}</div>
      <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">${modePill(m)} ${flowTag(m)}</div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.4px;margin-bottom:6px;text-align:right">KONDISI SUPPLY</div>
      <div class="bld-toggle">
        <button class="${m==='EXISTING'?'on amber':''}" onclick="setMode('${bId}','EXISTING')">EXISTING</button>
        <button class="${m==='NEXT'?'on':''}" onclick="setMode('${bId}','NEXT')">NEXT</button>
      </div>
    </div>
  </div>`;

  const explain = m==='EXISTING'
    ? alertBox('warn','warn',`<b>Kondisi EXISTING — sistem PUSH (dorong).</b> Supply dikirim ke <b>area transit</b> tiap line. Yang menekan tombol adalah <b>operator warehouse</b> lewat tablet. Aturan: area transit <b>tidak boleh kosong</b> komponen — begitu status menipis/kosong, dorong sekarang.`)
    : alertBox('info','info',`<b>Kondisi NEXT — sistem PULL (tarik).</b> Supply dikirim <b>langsung ke titik supply di line</b>. Yang menekan tombol adalah <b>PIC produksi</b> di titik masing-masing (Packaging / Cover / Separator) saat material di titiknya perlu diisi.`);

  const blocks = linesOf(bId).map(l=>{
    const wo=activeWO(l.id);
    const isChg=l.type==='CHARGING';
    const meta = isChg
      ? 'Line Charging · titik supply: Packaging saja'
      : `CT ${esc(l.ct)} dtk/pcs · ${esc(l.pp)} pcs/pallet · kapasitas ${esc(l.cap)}`;
    const woStrip = wo ? `<div class="wo-strip">
        <span class="lbl">WO AKTIF</span>
        <span class="wo-id">${esc(wo.id)}</span>
        <span class="wo-sku">${esc(wo.sku)}</span>
        <span class="bar"><i style="width:${Math.min(100,Math.round(wo.done/wo.qty*100))}%"></i></span>
        <span class="prog">${esc(wo.done)} / ${esc(wo.qty)} pcs · ${Math.round(wo.done/wo.qty*100)}%</span>
      </div>` : '';
    const cards = pointsOf(l).map(t=>{
      const key=pid(l,t), s=st[key]||{stock:'OK'}, d=destOf(l,t,m);
      const cls = s.calling?'st-calling':(s.stock==='EMPTY'?'st-empty':(s.stock==='LOW'?'st-low':''));
      const enabled = (canPush||canPull) && !s.calling;
      const btnLabel = m==='EXISTING'?'DORONG KE TRANSIT':'PANGGIL AMR';
      return `<div class="pt-card ${cls}">
        <div class="pt-top">
          <div class="pico">${svg(PTYPE[t].icon)}</div>
          <div><div class="pt-name">${esc(PTYPE[t].label)}</div><div class="pt-mat">${esc(PTYPE[t].mat)}</div></div>
        </div>
        <div class="pt-dest">${svgS('pin',13)} Tujuan <b>${esc(d.code)}</b><br>${esc(d.label)}</div>
        <div class="pt-status">
          <span class="s-dot ${s.calling?'s-calling':stockClass(s.stock)}"></span>
          ${s.calling?'AMR dalam perjalanan…':'Status stok: '+stockLabel(s.stock)}
          ${s.last?`<span style="margin-left:auto;font-weight:500;font-size:11px;color:var(--muted)">${esc(s.last)}</span>`:''}
        </div>
        <div class="pt-actions">
          <button class="btn-call ${m==='EXISTING'?'push':''}" ${enabled?'':'disabled'} onclick="callAMR('${l.id}','${t}')">
            ${svg(m==='EXISTING'?'truck':'bell')} ${btnLabel}
          </button>
          <button class="btn-sm-ghost" title="Ubah status stok (simulasi)" onclick="cycleStock('${l.id}','${t}')">${svgS('refresh',15)}</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="board-line">
      <div class="board-line-head">
        ${isChg?svgS('charge',17):svgS('board',17)}
        <span class="ln">${esc(l.name)}</span>
        ${l.sku?`<span class="sku">${esc(l.sku)}</span>`:''}
        <span class="tiny-tag">${pointsOf(l).length} titik</span>
        <span class="meta">${meta}</span>
      </div>
      <div class="pt-grid">${woStrip?`<div style="grid-column:1/-1">${woStrip}</div>`:''}${cards}</div>
    </div>`;
  }).join('');

  const roleNote = (!canPush&&!canPull)
    ? alertBox('warn','warn',`Peran <b>${esc(r.name)}</b> tidak berwenang memanggil AMR pada kondisi <b>${m}</b> di gedung ini. ${m==='EXISTING'?'Kondisi EXISTING dipicu operator warehouse.':'Kondisi NEXT dipicu PIC produksi di titik supply.'} Ganti peran di kanan atas untuk mencoba.`)
    : '';

  return head(b.name,`Papan supply ${esc(b.name)} — ${linesOf(bId).length} line, ${linesOf(bId).reduce((a,l)=>a+pointsOf(l).length,0)} titik supply.`)
    + banner + statusBanner(linesOf(bId)) + explain + roleNote + blocks;
};
function cycleStock(lineId,type){
  const cur=(pstate()[pid(line(lineId),type)]||{}).stock||'OK';
  setStock(lineId,type, cur==='OK'?'LOW':(cur==='LOW'?'EMPTY':'OK'));
}

  return `<div class="pic-panel">
    ${preview?alertBox('info','info',`<b>Mode pratinjau.</b> Anda masuk sebagai <b>${esc(r.name)}</b>, bukan PIC produksi. Panel ini ditampilkan apa adanya seperti yang dilihat PIC di tablet titik supply, tapi tombol panggil mengikuti kewenangan peran Anda.`):''}
    ${ptChips}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;justify-content:center">${chips}</div>
    ${notice}
    <div class="pic-hero">
      <div class="who">${svgS(PTYPE[t].icon,14)} PIC ${esc(PTYPE[t].label)}</div>
      <h2>${esc(l.name)}</h2>
      <div class="loc">${esc(bld(l.bld).name)} · ${esc(PTYPE[t].mat)}</div>
      <div style="margin-top:13px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">${modePill(m)} ${flowTag(m)}</div>
      <div class="pt-dest" style="margin-top:15px;text-align:left">${svgS('pin',13)} Tujuan <b>${esc(d.code)}</b><br>${esc(d.label)}</div>
      ${wo?`<div class="wo-strip" style="margin-top:14px">
        <span class="lbl">WO AKTIF</span><span class="wo-id">${esc(wo.id)}</span>
        <span class="wo-sku">${esc(wo.sku)}</span>
        <span class="bar"><i style="width:${Math.min(100,Math.round(wo.done/wo.qty*100))}%"></i></span>
        <span class="prog">${esc(wo.done)} / ${esc(wo.qty)} pcs</span></div>`:''}
      <div class="pt-status" style="justify-content:center;margin-top:13px">
        <span class="s-dot ${s.calling?'s-calling':stockClass(s.stock)}"></span>
        ${s.calling?'AMR dalam perjalanan…':'Status titik: '+stockLabel(s.stock)}
      </div>
    </div>
    <div class="pic-big">

function assignLine(t,lineId){const a=DB.get('assignedLine',{});a[t]=lineId;DB.set('assignedLine',a);route();}

/* ---------- ANTRIAN WORK ORDER ---------- */
PAGES.wo=function(){
  const all=DB.get('wo',{});
  const scope = LINES;
  const blocks=scope.map(l=>{
    const list=all[l.id]||[];
    const rows=list.map((w,i)=>`
      <div class="wo-row ${w.status==='RUNNING'?'running':(w.status==='DONE'?'done':'')}">
        <div class="seq">${i+1}</div>
        <div><div class="wid">${esc(w.id)}</div><div class="wsku">${esc(w.sku)}</div></div>
        <span class="bar"><i style="width:${Math.min(100,Math.round(w.done/w.qty*100))}%"></i></span>
        <div class="wqty">${esc(w.done)} / ${esc(w.qty)} pcs</div>
        <span class="badge ${w.status==='RUNNING'?'green':(w.status==='DONE'?'gray':'amber')}">${esc(w.status)}</span>
        <div class="wact">
          ${w.status!=='DONE'?`<button class="btn-sm-ghost" style="padding:6px 10px" onclick="advanceWO('${l.id}','${w.id}')">${svgS('check',14)} Selesai</button>`:''}
          <button class="btn-sm-ghost" style="padding:6px 10px" onclick="delWO('${l.id}','${w.id}')">${svgS('trash',14)}</button>
        </div>
      </div>`).join('') || `<div class="cell-sub" style="padding:10px">Belum ada WO untuk line ini.</div>`;
    return `<div class="board-line">
      <div class="board-line-head">
        ${l.type==='CHARGING'?svgS('charge',17):svgS('board',17)}
        <span class="ln">${esc(l.name)}</span>${l.sku?`<span class="sku">${esc(l.sku)}</span>`:''}
        <span class="tiny-tag">${esc(bld(l.bld).name)}</span>
        <span class="meta"><button class="btn btn-ghost" style="padding:6px 11px" onclick="addWO('${l.id}')">${svgS('plus',14)} Tambah WO</button></span>
      </div>
      <div class="pt-grid" style="grid-template-columns:1fr"><div class="wo-list">${rows}</div></div>
    </div>`;
  }).join('');
  return head('Antrian Work Order','Urutan WO yang harus dipenuhi tiap line. WO teratas yang berstatus RUNNING otomatis menjadi konteks setiap panggilan AMR.')
    + alertBox('info','info','Panggilan AMR selalu dicatat bersama <b>WO aktif</b> line tersebut, sehingga konsumsi material bisa ditelusuri per WO.')
    + blocks;
};
function advanceWO(lineId,woId){
  const all=DB.get('wo',{}); const list=all[lineId]||[];
  const i=list.findIndex(w=>w.id===woId); if(i<0)return;
  list[i].status='DONE'; list[i].done=list[i].qty;
  const nxt=list.find(w=>w.status==='QUEUED'); if(nxt)nxt.status='RUNNING';
  all[lineId]=list; DB.set('wo',all);
  logIt(`${woId} diselesaikan di ${line(lineId).name}`); toast(`${woId} selesai`); route();
}
function delWO(lineId,woId){
  const all=DB.get('wo',{}); all[lineId]=(all[lineId]||[]).filter(w=>w.id!==woId);
  DB.set('wo',all); toast('WO dihapus'); route();
}
function addWO(lineId){
  const l=line(lineId);
  openModal(`Tambah WO — ${l.name}`,
    fld('Nomor WO','w_id','text',`WO-${l.id}-${String(((DB.get('wo',{})[lineId]||[]).length+1)).padStart(3,'0')}`)+
    fld('SKU / Tipe','w_sku','text',l.sku||'Charging Batch')+
    fld('Qty (pcs)','w_qty','number',l.cap||1),
    ()=>{
      if(!v('w_id'))return toast('Nomor WO wajib diisi')||false;
      const all=DB.get('wo',{}); const list=all[lineId]||[];
      list.push({id:v('w_id'),sku:v('w_sku'),qty:+v('w_qty')||1,done:0,status:list.some(w=>w.status==='RUNNING')?'QUEUED':'RUNNING'});
      all[lineId]=list; DB.set('wo',all); logIt(`WO ${v('w_id')} ditambahkan ke ${l.name}`); route(); toast('WO ditambahkan');
    });
}

  return `<div class="table-wrap"><table>
    <thead><tr><th>Waktu</th><th>Alur</th><th>Line / Titik</th><th>Tujuan</th><th>WO</th><th>Robot</th><th>Status</th><th>Pemicu</th></tr></thead>
    <tbody>${list.map(o=>`<tr>
      <td class="cell-sub">${esc(o.ts)}<div class="cell-sub">${esc(o.id)}</div></td>
      <td>${flowTag(o.mode)}</td>
      <td class="cell-strong">${esc(o.lineName)}<div class="cell-sub">${esc(PTYPE[o.type].label)} — ${esc(o.material)}</div></td>
      <td class="cell-sub">${esc(o.destCode)}<div class="cell-sub">${esc(o.destLabel)}</div></td>
      <td class="cell-sub">${esc(o.wo)}<div class="cell-sub">${esc(o.sku)}</div></td>
      <td class="cell-sub" style="color:var(--brand-strong)">${esc(o.robot)}</td>
      <td><span class="badge ${o.status==='DELIVERED'?'green':(o.status==='ASSIGNED'?'amber':'red')}">${esc(o.status)}</span></td>
      <td class="cell-sub">${esc(o.by)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
PAGES.orders=function(){
  const r=role(); let list=DB.get('orders',[]);
  if(r.kind==='PIC') list=list.filter(o=>o.type===r.pt);
  const f=DB.get('ordFilter',{bld:'Semua Gedung',flow:'Semua Alur',st:'Semua Status'});
  if(f.bld!=='Semua Gedung'){const b=BUILDINGS.find(x=>x.name===f.bld);if(b)list=list.filter(o=>o.bld===b.id);}
  if(f.flow!=='Semua Alur')  list=list.filter(o=>o.flow===f.flow);
  if(f.st!=='Semua Status')  list=list.filter(o=>o.status===f.st);
  const opt=(arr,cur)=>arr.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
  const filter=`<div class="card card-pad" style="margin-bottom:18px"><div class="filters">
    <div class="field"><label>Gedung</label><select onchange="setOrdFilter('bld',this.value)">${opt(['Semua Gedung',...BUILDINGS.map(b=>b.name)],f.bld)}</select></div>
    <div class="field"><label>Alur</label><select onchange="setOrdFilter('flow',this.value)">${opt(['Semua Alur','PUSH','PULL'],f.flow)}</select></div>
    <div class="field"><label>Status</label><select onchange="setOrdFilter('st',this.value)">${opt(['Semua Status','PENDING','ASSIGNED','DELIVERED'],f.st)}</select></div>
  </div></div>`;
  return head('Orders — Riwayat Panggilan',`Semua panggilan AMR — PUSH (transit) maupun PULL (titik supply line) — beserta WO yang sedang berjalan saat panggilan dibuat.`)
    + filter + ordersTable(list);
};

/* ---------- MATRIKS HARMONISASI ---------- */
PAGES.matrix=function(){
  const rows=LINES.map(l=>{
    const m=modeOf(l.bld);
    return pointsOf(l).map((t,i)=>{
      const ex=destOf(l,t,'EXISTING'), nx=destOf(l,t,'NEXT');
      return `<tr>
        ${i===0?`<td class="grp" rowspan="${pointsOf(l).length}">${esc(bld(l.bld).name)}<div class="cell-sub">${esc(l.name)}${l.sku?' · '+esc(l.sku):''}</div></td>`:''}
        <td>${svgS(PTYPE[t].icon,15)} <b>${esc(PTYPE[t].label)}</b><div class="cell-sub">${esc(PTYPE[t].mat)}</div></td>
        <td><span class="tiny-tag">${esc(ex.code)}</span><div class="cell-sub">Area transit ${esc(l.name)}</div></td>
        <td><span class="flow-tag push">PUSH</span><div class="cell-sub">Operator WH (tablet)</div></td>
        <td><span class="tiny-tag">${esc(nx.code)}</span><div class="cell-sub">Titik supply di line</div></td>
        <td><span class="flow-tag pull">PULL</span><div class="cell-sub">PIC ${esc(PTYPE[t].label)}</div></td>
        ${i===0?`<td class="grp" rowspan="${pointsOf(l).length}">${modePill(m)}</td>`:''}
      </tr>`;
    }).join('');
  }).join('');
  return head('Matriks Harmonisasi','Pemetaan lengkap tiap titik supply: tujuan dan pemicu pada kondisi EXISTING vs NEXT.')
    + alertBox('info','info','Struktur titik <b>tidak berubah</b> antara EXISTING dan NEXT — yang berubah hanya <b>lokasi tujuan</b> (transit → titik line) dan <b>siapa yang memicu</b> (warehouse → PIC produksi). Itulah dasar harmonisasinya.')
    + `<div class="matrix-wrap"><table class="matrix">
      <thead><tr>
        <th>Gedung / Line</th><th>Titik Supply</th>
        <th>EXISTING — tujuan</th><th>EXISTING — pemicu</th>
        <th>NEXT — tujuan</th><th>NEXT — pemicu</th><th>Mode aktif</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
};

function addRobot(){
  openModal('Tambah AMR',
    fld('Serial Number','r_sn')+fld('Nama','r_name')+fld('IP Address','r_ip','text','','mis. 192.168.110.212')+
    sel('Gedung','r_bld',BUILDINGS.map(b=>b.name))+fld('Baterai %','r_batt','number','100')+sel('Status','r_st',['online','offline','charging']),
    ()=>{
      if(!v('r_sn'))return toast('SN wajib diisi')||false;

/* Peta canvas — SATU loop global, selalu dibatalkan oleh route() lewat stopMap() */
let mapAnim=null, mapResize=null;
function stopMap(){
  if(mapAnim){cancelAnimationFrame(mapAnim);mapAnim=null;}
  if(mapResize){window.removeEventListener('resize',mapResize);mapResize=null;}
}
function startMap(bId){
  stopMap();
  const c=document.getElementById('map3d'); if(!c) return;
  const dpr=window.devicePixelRatio||1;
  const size=()=>{c.width=Math.max(1,c.clientWidth*dpr);c.height=Math.max(1,c.clientHeight*dpr);};
  size(); mapResize=size; window.addEventListener('resize',mapResize);
  const ctx=c.getContext('2d'); const n=linesOf(bId).length; let t=0;
  function draw(){
    if(!document.body.contains(c)){stopMap();return;}   /* canvas dilepas → loop berhenti */
    const w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h); ctx.fillStyle='#0b1220'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(45,212,191,.18)'; ctx.lineWidth=1*dpr;
    const cx=w*0.5, hz=h*0.42;
    for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(cx+i*40*dpr,hz);ctx.lineTo(cx+i*220*dpr,h);ctx.stroke();}
    for(let j=0;j<14;j++){const y=hz+Math.pow(j/14,2)*(h-hz);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    ctx.fillStyle='rgba(226,232,240,.9)';
    ctx.beginPath();
    const rw=320*dpr, rh=150*dpr, rx0=cx-rw/2, ry0=hz+70*dpr;
    if(ctx.roundRect) ctx.roundRect(rx0,ry0,rw,rh,8*dpr); else ctx.rect(rx0,ry0,rw,rh);
    ctx.fill();
    ctx.fillStyle='#0b1220';
    for(let i=0;i<n;i++){ctx.fillRect(rx0+20*dpr+i*(rw-40*dpr)/Math.max(1,n), ry0+30*dpr, (rw-40*dpr)/Math.max(1,n)-10*dpr, 80*dpr);}
    const rx=cx+Math.sin(t/60)*80*dpr, ry=hz+150*dpr;
    ctx.fillStyle='#111';ctx.fillRect(rx-14*dpr,ry-9*dpr,28*dpr,18*dpr);
    ctx.fillStyle='#2dd4bf';ctx.beginPath();ctx.arc(rx,ry-16*dpr,4*dpr,0,7);ctx.fill();
    const gx=w-80*dpr, gy=h-70*dpr; ctx.lineWidth=3*dpr;
    ctx.strokeStyle='#22c55e';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy-30*dpr);ctx.stroke();
    ctx.strokeStyle='#ef4444';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+28*dpr,gy);ctx.stroke();
    ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(gx,gy,7*dpr,0,7);ctx.fill();
    t++; mapAnim=requestAnimationFrame(draw);
  }
  draw();
}
