<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMR Autoxing CBI — Harmonisasi Supply</title>
<style>
/* ============================================================
   AMR Autoxing CBI — Middleware Portal
   Single-file clone of SYS-AX Middleware layout.
   Data is stored in localStorage (keys prefixed "amr_") so it
   can be populated later via the Add/Edit actions on each page.
   ============================================================ */

:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --sidebar:#ffffff;
  --border:#eceef1;
  --border-2:#e4e7eb;
  --text:#0f172a;
  --text-2:#475569;
  --muted:#94a3b8;
  --brand:#14b8a6;         /* teal icons / links */
  --brand-2:#17c3a3;       /* buttons */
  --brand-strong:#0ea38b;
  --brand-tint:#e9faf5;
  --brand-tint-2:#d5f4ec;
  --amber:#f59e0b;
  --amber-tint:#fef3e2;
  --red:#ef4444;
  --red-tint:#fdecec;
  --green:#16a34a;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(16,24,40,.10);
  --radius:14px;
  --radius-sm:10px;
  --sidebar-w:256px;
}
html[data-theme="dark"]{
  --bg:#0b1220;
  --surface:#111a2b;
  --surface-2:#0e1626;
  --sidebar:#0d1524;
  --border:#1e293b;
  --border-2:#24344a;
  --text:#e6edf6;
  --text-2:#9fb0c4;
  --muted:#64748b;
  --brand-tint:rgba(20,184,166,.12);
  --brand-tint-2:rgba(20,184,166,.18);
  --amber-tint:rgba(245,158,11,.14);
  --red-tint:rgba(239,68,68,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:margin-left .25s ease;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:12px;
  padding:20px 20px;
  border-bottom:1px solid var(--border);
}
.brand .mark{
  width:40px;height:40px;border-radius:11px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--brand-2),var(--brand));
  display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 12px rgba(20,184,166,.35);
}
.brand .mark svg{width:22px;height:22px}
.brand .txt{line-height:1.15}
.brand .txt b{font-size:15px;font-weight:800;letter-spacing:.2px;display:block}
.brand .txt span{font-size:12px;color:var(--text-2)}

.nav{flex:1;overflow-y:auto;padding:12px 12px 8px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:var(--radius-sm);
  color:var(--text);font-weight:500;
  cursor:pointer;user-select:none;position:relative;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--surface-2)}
.nav-item .ic{width:18px;height:18px;color:var(--brand);flex:0 0 18px}
.nav-item.parent .ic{color:var(--text-2)}
.nav-item .caret{margin-left:auto;color:var(--muted);transition:transform .18s}
.nav-item.open .caret{transform:rotate(90deg)}
.nav-item.active{background:var(--brand-tint);color:var(--brand-strong)}
.nav-item.active .ic{color:var(--brand-strong)}
.nav-group{margin-bottom:2px}
.nav-children{
  margin:2px 0 2px 22px;padding-left:12px;
  border-left:1px solid var(--border-2);
  overflow:hidden;
}
.nav-children .nav-item{padding:8px 12px;font-weight:500}
.subheading{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;
  padding:14px 14px 6px;
}

.sidebar-foot{
  border-top:1px solid var(--border);
  padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;
}
.avatar{
  width:38px;height:38px;border-radius:10px;flex:0 0 38px;
  background:var(--brand-tint);color:var(--brand-strong);
  display:grid;place-items:center;font-weight:800;font-size:13px;
}
.sidebar-foot .who b{display:block;font-size:13.5px;font-weight:700}
.sidebar-foot .who span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sidebar-foot .logout{margin-left:auto;color:var(--muted);padding:6px;border-radius:8px;background:none;border:0}
.sidebar-foot .logout:hover{color:var(--red);background:var(--red-tint)}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:64px;display:flex;align-items:center;gap:16px;
  padding:0 24px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:0;background:none;
  color:var(--text-2);display:grid;place-items:center;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:14px;flex-wrap:wrap}
.breadcrumb .sep{color:var(--muted)}
.breadcrumb .cur{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.session-pill{
  display:flex;align-items:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-2);padding:6px 12px;border-radius:999px;
  font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;
}
.session-pill svg{width:15px;height:15px;color:var(--muted)}
.topbar .divider{width:1px;height:24px;background:var(--border)}

/* ---------- Content ---------- */
.content{padding:28px 32px 48px;max-width:1360px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-head{margin-bottom:22px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:240px}
h1.page-title{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.page-sub{color:var(--text-2);font-size:14.5px;margin:0}
.head-actions{display:flex;gap:10px;align-items:center;margin-left:auto}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--border-2);background:var(--surface);color:var(--text);
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px;
  transition:background .12s,border-color .12s,transform .05s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;box-shadow:0 4px 12px rgba(20,184,166,.28)}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn-ghost{background:none;border-color:var(--border)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.section-label{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;margin:26px 0 12px;
}
.section-label svg{width:15px;height:15px;color:var(--brand)}
.grid{display:grid;gap:16px}

/* ---------- Table ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;font-size:12.5px;font-weight:700;color:var(--text-2);
  padding:14px 18px;border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:15px 18px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.cell-strong{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tbl-foot{display:flex;align-items:center;gap:18px;padding:14px 18px;flex-wrap:wrap;color:var(--text-2);font-size:13px}
.tbl-foot .grow{flex:1}
.select-mini{border:1px solid var(--border-2);background:var(--surface);border-radius:8px;padding:5px 8px;color:var(--text);font-size:13px}
.pager{display:flex;gap:4px}
.pager button{width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:8px;color:var(--text-2)}
.pager button:hover:not(:disabled){background:var(--surface-2)}
.pager button:disabled{opacity:.4;cursor:default}

/* ---------- Badges & chips ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;line-height:1}
.badge.green{background:var(--brand-tint);color:var(--brand-strong)}
.badge.gray{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.badge.amber{background:var(--amber-tint);color:#b45309}
.badge.red{background:var(--red-tint);color:#dc2626}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:linear-gradient(135deg,#fde68a,#fbbf24);color:#7c4a03}
.chip.robot{background:linear-gradient(135deg,#fcd34d,#f59e0b);color:#6b3d02}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.dot.off{background:var(--muted)}

/* ---------- Action icons in table ---------- */
.actions{display:flex;gap:4px;align-items:center}
.act{width:32px;height:32px;border:0;background:none;border-radius:8px;color:var(--text-2);display:grid;place-items:center}
.act:hover{background:var(--surface-2)}
.act svg{width:16px;height:16px}
.act.brand{color:var(--brand)}
.act.brand:hover{background:var(--brand-tint)}
.act.amber{color:var(--amber)}.act.amber:hover{background:var(--amber-tint)}
.act.danger{color:var(--red)}.act.danger:hover{background:var(--red-tint)}

/* ---------- Stat / telemetry cards ---------- */
.tele-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.tele-card{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.tele-card .name{font-weight:700;font-size:15px}
.tele-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tele-row{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:13px;margin-top:8px}
.tele-row .l{display:flex;align-items:center;gap:8px}
.tele-row .l svg{width:15px;height:15px;color:var(--muted)}
.batt{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.batt svg{width:18px;height:18px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:6px}
.stat{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.stat .top{display:flex;align-items:center;justify-content:space-between;color:var(--text-2);font-size:13px;font-weight:600}
.stat .top svg{width:18px;height:18px;color:var(--brand)}
.stat .big{font-size:30px;font-weight:800;margin-top:14px;letter-spacing:-.02em}
.stat .cap{color:var(--muted);font-size:12.5px;margin-top:2px}

/* ---------- Filters ---------- */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text-2);text-transform:uppercase;margin-bottom:6px}
.field select,.field input{
  width:100%;border:1px solid var(--border-2);background:var(--surface);
  color:var(--text);padding:10px 12px;border-radius:10px;font-size:13.5px;
}
.field input[type="datetime-local"]{color:var(--text-2)}

/* ---------- Lifecycle timeline ---------- */
.lifecycle{display:flex;gap:20px;flex-wrap:wrap}
.lc{min-width:64px}
.lc .k{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.lc .v{font-size:12.5px;font-weight:700;color:var(--brand-strong);font-variant-numeric:tabular-nums}
.lc.empty .v{color:var(--muted)}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;padding:56px 24px;color:var(--text-2);
}
.empty .ic{width:56px;height:56px;border-radius:16px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
.empty .ic svg{width:26px;height:26px}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:700;color:var(--text)}
.empty p{margin:0 auto 18px;max-width:420px}

/* ---------- Machine Call ---------- */
.mc-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.mc-head .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center}
.mc-head .ic svg{width:26px;height:26px}
.mc-head h2{margin:0;font-size:26px;font-weight:800;letter-spacing:.02em}
.mc-head .loc{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--brand-strong);display:flex;align-items:center;gap:5px;text-transform:uppercase}
.mc-head .eng{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--amber);background:var(--amber-tint);padding:7px 12px;border-radius:999px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.status-bar{
  display:flex;align-items:center;gap:18px;
  border:2px dashed var(--brand-tint-2);border-radius:16px;padding:18px 22px;margin:18px 0;background:var(--surface)
}
.status-bar .clk{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.status-bar .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.status-bar .v{font-size:18px;font-weight:800;color:var(--brand-strong)}
.status-bar .pipe{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.status-bar .pulse{border:1px solid var(--border);border-radius:12px;padding:8px 14px;text-align:center}
.status-bar .pulse .k{color:var(--muted)}
.status-bar .pulse b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}

.call-panel{border:1px solid var(--border);border-radius:20px;padding:22px;background:var(--surface);box-shadow:var(--shadow)}
.call-reason{margin-bottom:18px}
.call-reason .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--brand-strong);text-transform:uppercase;margin-bottom:8px}
.call-reason select{border:1px solid var(--border-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;color:var(--text)}
.call-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.call-btn{
  border:1px solid var(--border);border-radius:18px;padding:40px 20px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
  background:var(--surface-2);color:var(--muted);font-weight:800;letter-spacing:.06em;font-size:20px;
  transition:transform .08s,box-shadow .12s;
}
.call-btn .cico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.call-btn .cico svg{width:28px;height:28px}
.call-btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;box-shadow:0 12px 30px rgba(20,184,166,.35)}
.call-btn.primary .cico{background:rgba(255,255,255,.22);color:#fff}
.call-btn.primary:hover{transform:translateY(-2px)}
.call-foot{text-align:center;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}

/* ---------- Area Monitor ---------- */
.am-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.am-head .ic{width:48px;height:48px;border-radius:13px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center}
.am-head h2{margin:0;font-size:26px;font-weight:800}
.am-head .sub{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.am-head .live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--brand-strong)}
.am-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
.map3d{position:relative;border-radius:16px;overflow:hidden;min-height:440px;background:#0b1220;border:1px solid var(--border)}
.map3d canvas{display:block;width:100%;height:100%}
.control-center{
  position:absolute;top:18px;left:18px;width:220px;
  background:rgba(13,20,34,.82);backdrop-filter:blur(6px);
  border:1px solid rgba(45,212,191,.25);border-radius:14px;padding:16px;color:#cbd5e1;
}
.control-center h4{margin:0 0 12px;font-size:11px;font-weight:800;letter-spacing:.14em;color:#2dd4bf;text-transform:uppercase}
.cc-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px}
.cc-row .kbd{background:#1e293b;border:1px solid #334155;border-radius:7px;padding:3px 8px;font-size:11px;color:#e2e8f0;font-family:ui-monospace,monospace}
.cc-meta{border-top:1px solid #24344a;margin-top:12px;padding-top:12px;font-size:11px;color:#94a3b8}
.cc-meta b{color:#e2e8f0}
.cc-reset{width:100%;margin-top:14px;background:var(--brand-2);border:0;color:#fff;border-radius:10px;padding:9px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.robot-status .head,.order-q .head{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:14px}
.robot-status .head::before,.order-q .head::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand)}
.rstat{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.rstat .r1{display:flex;align-items:center;justify-content:space-between}
.rstat .idle{margin-top:12px;background:var(--surface-2);border-radius:9px;padding:9px 12px;color:var(--text-2);font-size:13px;display:flex;align-items:center;gap:8px}
.order-q{margin-top:20px}
.order-q .empty-q{text-align:center;color:var(--muted);padding:40px 10px;font-style:italic}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal .m-head{display:flex;align-items:center;padding:20px 22px;border-bottom:1px solid var(--border)}
.modal .m-head h3{margin:0;font-size:18px;font-weight:800}
.modal .m-body{padding:22px;display:grid;gap:16px;max-height:64vh;overflow:auto}
.modal .m-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-field label{display:block;font-size:12px;font-weight:700;color:var(--brand-strong);margin-bottom:6px}
.form-field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.form-field input,.form-field select,.form-field textarea{
  width:100%;border:1px solid var(--border-2);background:var(--surface);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;
}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:slidein .25s ease}
html[data-theme="dark"] .toast{background:#e6edf6;color:#0b1220}
.toast svg{width:17px;height:17px;color:var(--brand-2)}

function titleOf(id){
  if(id.startsWith('bld-')){const b=bld(id.slice(4));return b?b.name:'—';}
  if(id.startsWith('mon-')){const b=bld(id.slice(4));return b?'Monitor '+b.name:'—';}
  if(id.startsWith('line-')){const l=line(id.slice(5));return l?l.name:'—';}
  return TITLES[id]||'Dashboard';

function route(){
  const id=curPage();
  stopMap();                       /* cegah RAF loop menumpuk antar halaman */
  renderNav();
  const bc=document.getElementById('breadcrumb');
  let crumb=`<span>Home</span>`;
  const grp = id.startsWith('bld-')?'Papan Supply'
            : id.startsWith('mon-')?'Area Monitor'
            : id.startsWith('line-')?'Machine Call'
            : PARENT[id];
  if(grp) crumb+=`<span class="sep">${svgS('chevR',14)}</span><span>${esc(grp)}</span>`;
  crumb+=`<span class="sep">${svgS('chevR',14)}</span><span class="cur">${esc(titleOf(id))}</span>`;
  bc.innerHTML=crumb;
  const view=document.getElementById('view');
  let html;
  if(id.startsWith('bld-'))       html=PAGES.building(id.slice(4));
  else if(id.startsWith('mon-'))  html=PAGES.monitor(id.slice(4));
  else if(id.startsWith('line-')) html=PAGES.lineCall(id.slice(5));
  else html=(PAGES[id]||PAGES.dashboard)();
  view.innerHTML=html;
  if(id.startsWith('mon-')) startMap(id.slice(4));
  window.scrollTo(0,0);
}

const inFlight={};
function callAMR(lineId,type,opts){
  opts=opts||{};
  const l=line(lineId), m=modeOf(l.bld), key=pid(l,type);
  if(inFlight[key]){toast('Panggilan untuk titik ini sedang diproses');return;}
  inFlight[key]=true; setTimeout(()=>{delete inFlight[key];},4000);

  const wo=activeWO(lineId);
  const d=destOf(l,type,m);
  const robots=DB.get('robots',[]).filter(r=>r.bld===l.bld && r.status==='online');
  const r=role();
  const order={
    id:'ORD-'+Date.now().toString().slice(-8),
    ts:new Date().toLocaleString('id-ID'),
    mode:m, flow:(m==='NEXT'?'PULL':'PUSH'),
    bld:l.bld, lineId:l.id, lineName:l.name,
    type, material:PTYPE[type].mat,
    destCode:d.code, destLabel:d.label,
    wo: wo?wo.id:'—', sku: wo?wo.sku:(l.sku||'—'),
    robot: robots.length?robots[0].sn:'BELUM ADA ROBOT',
    status: robots.length?'ASSIGNED':'PENDING',
    by: r.name
  };
  const list=DB.get('orders',[]); list.unshift(order); DB.set('orders',list);
  setPoint(key,{calling:true,last:order.ts});
  logIt(`${order.flow} · ${l.name} · ${PTYPE[type].label} → ${d.code} (${order.wo}) oleh ${r.name}`);
  toast(`${order.flow} terkirim — ${l.name} · ${PTYPE[type].label} → ${d.code}`);

  /* simulasi robot tiba: status titik kembali AMAN */
  setTimeout(()=>{
    setPoint(key,{calling:false,stock:'OK',qty:2});
    const ls=DB.get('orders',[]); const o=ls.find(x=>x.id===order.id);
    if(o){o.status='DELIVERED';DB.set('orders',ls);}
    if(document.getElementById('view')) route();
  }, 6000);
  route();
}
function setStock(lineId,type,val){
  setPoint(pid(line(lineId),type),{stock:val,qty:val==='OK'?2:(val==='LOW'?1:0)});
  route();
}
function logIt(msg){
  const l=DB.get('logs',[]);
  l.unshift({time:new Date().toLocaleString('id-ID'),user:role().name,msg});
  DB.set('logs',l.slice(0,200));
}

/* ---------- PAPAN SUPPLY PER GEDUNG ---------- */
PAGES.building=function(bId){
  const b=bld(bId); if(!b) return PAGES.dashboard();
  const m=modeOf(bId), st=pstate(), r=role();
  const canPush = m==='EXISTING' && (r.kind==='ADMIN'||r.kind==='WH');
  const canPull = m==='NEXT'     && (r.kind==='ADMIN'||r.kind==='PIC');

  const banner=`<div class="bld-banner">
    <div class="bico">${svg('building')}</div>
    <div class="grow">
      <h2>${esc(b.name)}</h2>
      <div class="sub">${esc(b.desc)}</div>
      <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">${modePill(m)} ${flowTag(m)}</div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.4px;margin-bottom:6px;text-align:right">KONDISI SUPPLY</div>
      <div class="bld-toggle">
        <button class="${m==='EXISTING'?'on amber':''}" onclick="setMode('${bId}','EXISTING')">EXISTING</button>
        <button class="${m==='NEXT'?'on':''}" onclick="setMode('${bId}','NEXT')">NEXT</button>
      </div>
    </div>
  </div>`;

  const explain = m==='EXISTING'
    ? alertBox('warn','warn',`<b>Kondisi EXISTING — sistem PUSH (dorong).</b> Supply dikirim ke <b>area transit</b> tiap line. Yang menekan tombol adalah <b>operator warehouse</b> lewat tablet. Aturan: area transit <b>tidak boleh kosong</b> komponen — begitu status menipis/kosong, dorong sekarang.`)
    : alertBox('info','info',`<b>Kondisi NEXT — sistem PULL (tarik).</b> Supply dikirim <b>langsung ke titik supply di line</b>. Yang menekan tombol adalah <b>PIC produksi</b> di titik masing-masing (Packaging / Cover / Separator) saat material di titiknya perlu diisi.`);

  const blocks = linesOf(bId).map(l=>{
    const wo=activeWO(l.id);
    const isChg=l.type==='CHARGING';
    const meta = isChg
      ? 'Line Charging · titik supply: Packaging saja'
      : `CT ${esc(l.ct)} dtk/pcs · ${esc(l.pp)} pcs/pallet · kapasitas ${esc(l.cap)}`;
    const woStrip = wo ? `<div class="wo-strip">
        <span class="lbl">WO AKTIF</span>
        <span class="wo-id">${esc(wo.id)}</span>
        <span class="wo-sku">${esc(wo.sku)}</span>
        <span class="bar"><i style="width:${Math.min(100,Math.round(wo.done/wo.qty*100))}%"></i></span>
        <span class="prog">${esc(wo.done)} / ${esc(wo.qty)} pcs · ${Math.round(wo.done/wo.qty*100)}%</span>
      </div>` : '';
    const cards = pointsOf(l).map(t=>{
      const key=pid(l,t), s=st[key]||{stock:'OK'}, d=destOf(l,t,m);
      const cls = s.calling?'st-calling':(s.stock==='EMPTY'?'st-empty':(s.stock==='LOW'?'st-low':''));
      const enabled = (canPush||canPull) && !s.calling;
      const btnLabel = m==='EXISTING'?'DORONG KE TRANSIT':'PANGGIL AMR';
      return `<div class="pt-card ${cls}">
        <div class="pt-top">
          <div class="pico">${svg(PTYPE[t].icon)}</div>
          <div><div class="pt-name">${esc(PTYPE[t].label)}</div><div class="pt-mat">${esc(PTYPE[t].mat)}</div></div>
        </div>
        <div class="pt-dest">${svgS('pin',13)} Tujuan <b>${esc(d.code)}</b><br>${esc(d.label)}</div>
        <div class="pt-status">
          <span class="s-dot ${s.calling?'s-calling':stockClass(s.stock)}"></span>
          ${s.calling?'AMR dalam perjalanan…':'Status stok: '+stockLabel(s.stock)}
          ${s.last?`<span style="margin-left:auto;font-weight:500;font-size:11px;color:var(--muted)">${esc(s.last)}</span>`:''}
        </div>
        <div class="pt-actions">
          <button class="btn-call ${m==='EXISTING'?'push':''}" ${enabled?'':'disabled'} onclick="callAMR('${l.id}','${t}')">
            ${svg(m==='EXISTING'?'truck':'bell')} ${btnLabel}
          </button>
          <button class="btn-sm-ghost" title="Ubah status stok (simulasi)" onclick="cycleStock('${l.id}','${t}')">${svgS('refresh',15)}</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="board-line">
      <div class="board-line-head">
        ${isChg?svgS('charge',17):svgS('board',17)}
        <span class="ln">${esc(l.name)}</span>
        ${l.sku?`<span class="sku">${esc(l.sku)}</span>`:''}
        <span class="tiny-tag">${pointsOf(l).length} titik</span>
        <span class="meta">${meta}</span>
      </div>
      <div class="pt-grid">${woStrip?`<div style="grid-column:1/-1">${woStrip}</div>`:''}${cards}</div>
    </div>`;
  }).join('');

  const roleNote = (!canPush&&!canPull)
    ? alertBox('warn','warn',`Peran <b>${esc(r.name)}</b> tidak berwenang memanggil AMR pada kondisi <b>${m}</b> di gedung ini. ${m==='EXISTING'?'Kondisi EXISTING dipicu operator warehouse.':'Kondisi NEXT dipicu PIC produksi di titik supply.'} Ganti peran di kanan atas untuk mencoba.`)
    : '';

  return head(b.name,`Papan supply ${esc(b.name)} — ${linesOf(bId).length} line, ${linesOf(bId).reduce((a,l)=>a+pointsOf(l).length,0)} titik supply.`)
    + banner + statusBanner(linesOf(bId)) + explain + roleNote + blocks;
};
function cycleStock(lineId,type){
  const cur=(pstate()[pid(line(lineId),type)]||{}).stock||'OK';
  setStock(lineId,type, cur==='OK'?'LOW':(cur==='LOW'?'EMPTY':'OK'));
}

      <h2>${esc(l.name)}</h2>
      <div class="loc">${esc(bld(l.bld).name)} · ${esc(PTYPE[t].mat)}</div>

      <div class="pt-dest" style="margin-top:15px;text-align:left">${svgS('pin',13)} Tujuan <b>${esc(d.code)}</b><br>${esc(d.label)}</div>
      ${wo?`<div class="wo-strip" style="margin-top:14px">
        <span class="lbl">WO AKTIF</span><span class="wo-id">${esc(wo.id)}</span>
        <span class="wo-sku">${esc(wo.sku)}</span>
        <span class="bar"><i style="width:${Math.min(100,Math.round(wo.done/wo.qty*100))}%"></i></span>

/* ---------- ANTRIAN WORK ORDER ---------- */
PAGES.wo=function(){
  const all=DB.get('wo',{});
  const scope = LINES;
  const blocks=scope.map(l=>{
    const list=all[l.id]||[];
    const rows=list.map((w,i)=>`
      <div class="wo-row ${w.status==='RUNNING'?'running':(w.status==='DONE'?'done':'')}">
        <div class="seq">${i+1}</div>
        <div><div class="wid">${esc(w.id)}</div><div class="wsku">${esc(w.sku)}</div></div>
        <span class="bar"><i style="width:${Math.min(100,Math.round(w.done/w.qty*100))}%"></i></span>
        <div class="wqty">${esc(w.done)} / ${esc(w.qty)} pcs</div>
        <span class="badge ${w.status==='RUNNING'?'green':(w.status==='DONE'?'gray':'amber')}">${esc(w.status)}</span>
        <div class="wact">
          ${w.status!=='DONE'?`<button class="btn-sm-ghost" style="padding:6px 10px" onclick="advanceWO('${l.id}','${w.id}')">${svgS('check',14)} Selesai</button>`:''}
          <button class="btn-sm-ghost" style="padding:6px 10px" onclick="delWO('${l.id}','${w.id}')">${svgS('trash',14)}</button>
        </div>
      </div>`).join('') || `<div class="cell-sub" style="padding:10px">Belum ada WO untuk line ini.</div>`;
    return `<div class="board-line">
      <div class="board-line-head">
        ${l.type==='CHARGING'?svgS('charge',17):svgS('board',17)}
        <span class="ln">${esc(l.name)}</span>${l.sku?`<span class="sku">${esc(l.sku)}</span>`:''}
        <span class="tiny-tag">${esc(bld(l.bld).name)}</span>
        <span class="meta"><button class="btn btn-ghost" style="padding:6px 11px" onclick="addWO('${l.id}')">${svgS('plus',14)} Tambah WO</button></span>
      </div>
      <div class="pt-grid" style="grid-template-columns:1fr"><div class="wo-list">${rows}</div></div>
    </div>`;
  }).join('');
  return head('Antrian Work Order','Urutan WO yang harus dipenuhi tiap line. WO teratas yang berstatus RUNNING otomatis menjadi konteks setiap panggilan AMR.')
    + alertBox('info','info','Panggilan AMR selalu dicatat bersama <b>WO aktif</b> line tersebut, sehingga konsumsi material bisa ditelusuri per WO.')
    + blocks;
};
function advanceWO(lineId,woId){
  const all=DB.get('wo',{}); const list=all[lineId]||[];
  const i=list.findIndex(w=>w.id===woId); if(i<0)return;
  list[i].status='DONE'; list[i].done=list[i].qty;
  const nxt=list.find(w=>w.status==='QUEUED'); if(nxt)nxt.status='RUNNING';
  all[lineId]=list; DB.set('wo',all);
  logIt(`${woId} diselesaikan di ${line(lineId).name}`); toast(`${woId} selesai`); route();
}
function delWO(lineId,woId){
  const all=DB.get('wo',{}); all[lineId]=(all[lineId]||[]).filter(w=>w.id!==woId);
  DB.set('wo',all); toast('WO dihapus'); route();
}
function addWO(lineId){
  const l=line(lineId);
  openModal(`Tambah WO — ${l.name}`,
    fld('Nomor WO','w_id','text',`WO-${l.id}-${String(((DB.get('wo',{})[lineId]||[]).length+1)).padStart(3,'0')}`)+
    fld('SKU / Tipe','w_sku','text',l.sku||'Charging Batch')+
    fld('Qty (pcs)','w_qty','number',l.cap||1),
    ()=>{
      if(!v('w_id'))return toast('Nomor WO wajib diisi')||false;
      const all=DB.get('wo',{}); const list=all[lineId]||[];
      list.push({id:v('w_id'),sku:v('w_sku'),qty:+v('w_qty')||1,done:0,status:list.some(w=>w.status==='RUNNING')?'QUEUED':'RUNNING'});
      all[lineId]=list; DB.set('wo',all); logIt(`WO ${v('w_id')} ditambahkan ke ${l.name}`); route(); toast('WO ditambahkan');
    });
}

      <td>${flowTag(o.mode)}</td>
      <td class="cell-strong">${esc(o.lineName)}<div class="cell-sub">${esc(PTYPE[o.type].label)} — ${esc(o.material)}</div></td>
      <td class="cell-sub">${esc(o.destCode)}<div class="cell-sub">${esc(o.destLabel)}</div></td>
      <td class="cell-sub">${esc(o.wo)}<div class="cell-sub">${esc(o.sku)}</div></td>

      <td class="cell-sub">${esc(o.by)}</td>
    </tr>`).join('')}</tbody></table></div>`;

PAGES.orders=function(){
  const r=role(); let list=DB.get('orders',[]);
  if(r.kind==='PIC') list=list.filter(o=>o.type===r.pt);
  const f=DB.get('ordFilter',{bld:'Semua Gedung',flow:'Semua Alur',st:'Semua Status'});
  if(f.bld!=='Semua Gedung'){const b=BUILDINGS.find(x=>x.name===f.bld);if(b)list=list.filter(o=>o.bld===b.id);}
  if(f.flow!=='Semua Alur')  list=list.filter(o=>o.flow===f.flow);
  if(f.st!=='Semua Status')  list=list.filter(o=>o.status===f.st);
  const opt=(arr,cur)=>arr.map(o=>`<option ${o===cur?'selected':''}>${esc(o)}</option>`).join('');
  const filter=`<div class="card card-pad" style="margin-bottom:18px"><div class="filters">
    <div class="field"><label>Gedung</label><select onchange="setOrdFilter('bld',this.value)">${opt(['Semua Gedung',...BUILDINGS.map(b=>b.name)],f.bld)}</select></div>
    <div class="field"><label>Alur</label><select onchange="setOrdFilter('flow',this.value)">${opt(['Semua Alur','PUSH','PULL'],f.flow)}</select></div>
    <div class="field"><label>Status</label><select onchange="setOrdFilter('st',this.value)">${opt(['Semua Status','PENDING','ASSIGNED','DELIVERED'],f.st)}</select></div>
  </div></div>`;
  return head('Orders — Riwayat Panggilan',`Semua panggilan AMR — PUSH (transit) maupun PULL (titik supply line) — beserta WO yang sedang berjalan saat panggilan dibuat.`)
    + filter + ordersTable(list);
};

        <td>${svgS(PTYPE[t].icon,15)} <b>${esc(PTYPE[t].label)}</b><div class="cell-sub">${esc(PTYPE[t].mat)}</div></td>
        <td><span class="tiny-tag">${esc(ex.code)}</span><div class="cell-sub">Area transit ${esc(l.name)}</div></td>
        <td><span class="flow-tag push">PUSH</span><div class="cell-sub">Operator WH (tablet)</div></td>
        <td><span class="tiny-tag">${esc(nx.code)}</span><div class="cell-sub">Titik supply di line</div></td>
        <td><span class="flow-tag pull">PULL</span><div class="cell-sub">PIC ${esc(PTYPE[t].label)}</div></td>
        ${i===0?`<td class="grp" rowspan="${pointsOf(l).length}">${modePill(m)}</td>`:''}
      </tr>`;

    + alertBox('info','info','Struktur titik <b>tidak berubah</b> antara EXISTING dan NEXT — yang berubah hanya <b>lokasi tujuan</b> (transit → titik line) dan <b>siapa yang memicu</b> (warehouse → PIC produksi). Itulah dasar harmonisasinya.')
    + `<div class="matrix-wrap"><table class="matrix">
      <thead><tr>
        <th>Gedung / Line</th><th>Titik Supply</th>
        <th>EXISTING — tujuan</th><th>EXISTING — pemicu</th>
        <th>NEXT — tujuan</th><th>NEXT — pemicu</th><th>Mode aktif</th>

};

/* Peta canvas — SATU loop global, selalu dibatalkan oleh route() lewat stopMap() */
let mapAnim=null, mapResize=null;
function stopMap(){
  if(mapAnim){cancelAnimationFrame(mapAnim);mapAnim=null;}
  if(mapResize){window.removeEventListener('resize',mapResize);mapResize=null;}
}
function startMap(bId){
  stopMap();
  const c=document.getElementById('map3d'); if(!c) return;
  const dpr=window.devicePixelRatio||1;
  const size=()=>{c.width=Math.max(1,c.clientWidth*dpr);c.height=Math.max(1,c.clientHeight*dpr);};
  size(); mapResize=size; window.addEventListener('resize',mapResize);
  const ctx=c.getContext('2d'); const n=linesOf(bId).length; let t=0;
  function draw(){
    if(!document.body.contains(c)){stopMap();return;}   /* canvas dilepas → loop berhenti */
    const w=c.width,h=c.height;
    ctx.clearRect(0,0,w,h); ctx.fillStyle='#0b1220'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(45,212,191,.18)'; ctx.lineWidth=1*dpr;
    const cx=w*0.5, hz=h*0.42;
    for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(cx+i*40*dpr,hz);ctx.lineTo(cx+i*220*dpr,h);ctx.stroke();}
    for(let j=0;j<14;j++){const y=hz+Math.pow(j/14,2)*(h-hz);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
    ctx.fillStyle='rgba(226,232,240,.9)';
    ctx.beginPath();
    const rw=320*dpr, rh=150*dpr, rx0=cx-rw/2, ry0=hz+70*dpr;
    if(ctx.roundRect) ctx.roundRect(rx0,ry0,rw,rh,8*dpr); else ctx.rect(rx0,ry0,rw,rh);
    ctx.fill();
    ctx.fillStyle='#0b1220';
    for(let i=0;i<n;i++){ctx.fillRect(rx0+20*dpr+i*(rw-40*dpr)/Math.max(1,n), ry0+30*dpr, (rw-40*dpr)/Math.max(1,n)-10*dpr, 80*dpr);}
    const rx=cx+Math.sin(t/60)*80*dpr, ry=hz+150*dpr;
    ctx.fillStyle='#111';ctx.fillRect(rx-14*dpr,ry-9*dpr,28*dpr,18*dpr);
    ctx.fillStyle='#2dd4bf';ctx.beginPath();ctx.arc(rx,ry-16*dpr,4*dpr,0,7);ctx.fill();
    const gx=w-80*dpr, gy=h-70*dpr; ctx.lineWidth=3*dpr;
    ctx.strokeStyle='#22c55e';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy-30*dpr);ctx.stroke();
    ctx.strokeStyle='#ef4444';ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+28*dpr,gy);ctx.stroke();
    ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(gx,gy,7*dpr,0,7);ctx.fill();
    t++; mapAnim=requestAnimationFrame(draw);
  }
  draw();
}

/* =====================================================================
   STATUS TASK / ANDON
   Merah (ANDON) bila salah satu terpenuhi:
     1. Andon ditarik manual oleh operator/PIC
     2. Ada titik supply berstatus KOSONG
     3. Ada order yang tidak mendapat robot (status PENDING)
   Hijau (DONE) bila tidak ada satupun di atas.
   WO yang sedang RUNNING TIDAK membuat merah — itu produksi normal.
   ===================================================================== */
const andonDB = ()=>DB.get('andon',{});
function lineStatus(l){
  const why=[];
  const a=andonDB()[l.id];
  if(a&&a.active) why.push('Andon ditarik manual'+(a.reason?': '+a.reason:''));
  const st=pstate();
  pointsOf(l).forEach(t=>{ if((st[pid(l,t)]||{}).stock==='EMPTY') why.push(`Titik ${PTYPE[t].label} KOSONG`); });
  DB.get('orders',[]).filter(o=>o.lineId===l.id&&o.status==='PENDING')
    .forEach(o=>why.push(`Order ${o.id} tidak mendapat robot`));
  return {andon:why.length>0, why};
}
function plantStatus(){
  const bad=LINES.map(l=>({l,s:lineStatus(l)})).filter(x=>x.s.andon);
  const openTasks=DB.get('tasks',[]).filter(t=>t.status==='Pending'||t.status==='In Progress');
  const failTasks=DB.get('tasks',[]).filter(t=>t.status==='Failed');
  return {bad, openTasks, failTasks, ok: bad.length===0 && failTasks.length===0};
}
function statusBanner(scopeLines){
  const lines=scopeLines||LINES;
  const bad=lines.map(l=>({l,s:lineStatus(l)})).filter(x=>x.s.andon);
  const failTasks=DB.get('tasks',[]).filter(t=>t.status==='Failed');
  const openTasks=DB.get('tasks',[]).filter(t=>t.status==='Pending'||t.status==='In Progress');
  if(bad.length===0 && failTasks.length===0){
    return alertBox('ok','check',
      `<b>TASK DONE — tidak ada andon.</b> ${lines.length} line bersih: tidak ada titik supply kosong, tidak ada order tanpa robot, tidak ada task gagal.`
      + (openTasks.length?` <span style="opacity:.8">(${openTasks.length} task manual masih berjalan — tidak menghalangi produksi.)</span>`:''));
  }
  const items = bad.map(x=>`<div class="andon-item">${svgS('warn',15)}<div>${esc(x.l.name)}<div class="st-why">${esc(x.s.why.join(' · '))}</div></div></div>`).join('')
    + failTasks.map(t=>`<div class="andon-item">${svgS('warn',15)}<div>Task ${esc(t.id)} GAGAL<div class="st-why">${esc(t.type||'')} · ${esc(t.robot||'tanpa robot')}</div></div></div>`).join('');
  const n=bad.length+failTasks.length;
  return `<div class="alert bad"><div class="pulse-ring"></div><div style="flex:1">
      <b>ANDON AKTIF — perlu ditangani.</b>
      ${n} ${n===1?'item':'item'} menunggu penanganan. Produksi berisiko berhenti sampai supply atau task-nya diselesaikan.
      <div class="andon-grid">${items}</div>
    </div></div>`;
}
function toggleAndon(lineId){
  const a=andonDB(), cur=a[lineId];
  if(cur&&cur.active){
    a[lineId]={active:false};DB.set('andon',a);
    logIt(`Andon ${line(lineId).name} dinormalkan`);toast(`Andon ${line(lineId).name} dinormalkan`);route();
    return;
  }
  openModal(`Tarik Andon — ${line(lineId).name}`,
    sel('Penyebab','an_r',['Material telat','Trolley tidak tersedia','AMR tidak datang','Jalur terhalang','Lainnya']),
    ()=>{const x=andonDB();x[lineId]={active:true,reason:v('an_r'),ts:new Date().toLocaleString('id-ID')};
      DB.set('andon',x);logIt(`ANDON ${line(lineId).name}: ${v('an_r')}`);toast(`Andon ${line(lineId).name} ditarik`);route();});
}

/* ---------- MACHINES (v1) — stasiun panggil ---------- */
PAGES.machines=function(){
  const rows=LINES.map(l=>{
    const m=modeOf(l.bld), s=lineStatus(l), wo=activeWO(l.id);
    return `<tr>
      <td class="cell-strong">${svgS(l.type==='CHARGING'?'charge':'board',15)} ${esc(l.name)}<div class="cell-sub">${esc(l.id)}${l.sku?' · '+esc(l.sku):''}</div></td>
      <td>${esc(bld(l.bld).name)}</td>
      <td><span class="tiny-tag">${l.type==='CHARGING'?'CHARGING':'ASSEMBLY'}</span></td>
      <td>${pointsOf(l).map(t=>`<span class="chip robot">${esc(PTYPE[t].label)}</span>`).join(' ')}</td>
      <td>
        <button class="st-chip ${s.andon?'andon':'done'}" onclick="toggleAndon('${l.id}')" title="${s.andon?'Klik untuk normalkan andon':'Klik untuk menarik andon'}">
          <span class="d"></span>${s.andon?'ANDON':'DONE'}
        </button>
        <div class="st-why">${s.andon?esc(s.why.join(' · ')):(wo?esc(wo.id)+' berjalan · supply aman':'tidak ada WO aktif')}</div>
      </td>
      <td>${modePill(m)}</td>
      <td><div class="actions"><button class="act brand" title="Buka stasiun panggil" onclick="go('line-${l.id}')">${svg('play')}</button></div></td>
    </tr>`;
  }).join('');
  return head('Machines','Stasiun panggil tiap line produksi dan charging — diturunkan dari struktur pabrik (3 gedung / 9 line), bukan diinput manual. Tombol ▶ membuka stasiun panggil line tersebut.')
    + statusBanner()
    + `<div class="table-wrap"><table><thead><tr><th>Machine / Line</th><th>Gedung</th><th>Tipe</th><th>Titik Supply</th><th>Status Task / Andon</th><th>Mode</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};

/* ---------- TASKS (v1) ---------- */
PAGES.tasks=function(){
  const tasks=DB.get('tasks',[]);
  const rows=tasks.length?tasks.map((t,i)=>`<tr>
    <td class="cell-strong">${esc(t.id)}</td>
    <td class="cell-sub" style="color:var(--brand-strong)">${esc(t.robot||'—')}</td>
    <td>${esc(t.type||'—')}</td>
    <td><span class="badge ${t.status==='Completed'?'green':(t.status==='Failed'?'red':'amber')}">${esc(t.status||'Pending')}</span></td>
    <td class="cell-sub">${esc(t.created||'—')}</td>
    <td><div class="actions"><button class="act danger" title="Hapus" onclick="delIdx('tasks',${i})">${svg('trash')}</button></div></td>
  </tr>`).join('')
  :`<tr><td colspan="6"><div class="empty"><div class="ic">${svg('wo')}</div><h3>Belum ada task</h3><p>Task manual di luar alur panggilan otomatis dicatat di sini — mis. reposisi robot atau charging terjadwal.</p></div></td></tr>`;
  return head('Tasks','Task manual di luar alur panggilan supply (reposisi, charging terjadwal, uji jalur).',
    `<button class="btn btn-primary" onclick="addTask()">${svg('plus')} Tambah Task</button>`)
    + `<div class="table-wrap"><table><thead><tr><th>Task ID</th><th>Robot</th><th>Tipe</th><th>Status</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};
function addTask(){openModal('Tambah Task',
  fld('Task ID','t_id','text','TSK-'+String(DB.get('tasks',[]).length+1).padStart(3,'0'))+
  sel('Robot','t_robot',['—',...DB.get('robots',[]).map(r=>r.sn)])+
  sel('Tipe','t_type',['Reposisi','Charging','Uji jalur','Lainnya'])+
  sel('Status','t_status',['Pending','In Progress','Completed','Failed']),
  ()=>{if(!v('t_id'))return toast('Task ID wajib diisi')||false;
    const l=DB.get('tasks',[]);l.push({id:v('t_id'),robot:v('t_robot'),type:v('t_type'),status:v('t_status'),created:new Date().toLocaleString('id-ID')});
    DB.set('tasks',l);logIt(`Task ${v('t_id')} dibuat`);route();toast('Task ditambahkan');});}

/* ---------- USERS (v1) ---------- */
PAGES.users=function(){
  const users=DB.get('users',[]);
  const rows=users.length?users.map((u,i)=>`<tr>
    <td><div style="display:flex;align-items:center;gap:12px">
      <div class="avatar" style="width:34px;height:34px;font-size:12px">${esc(initials(u.name||'?'))}</div>
      <div><div class="cell-strong">${esc(u.name)}</div><div class="cell-sub">@${esc(u.username)}</div></div></div></td>
    <td><span class="badge ${u.role==='SUPER_ADMIN'?'green':'gray'}">${esc(u.role)}</span></td>
    <td class="cell-sub">${esc(u.scope||'—')}</td>
    <td><span class="badge ${u.status==='active'?'green':'gray'}">${esc(u.status)}</span></td>
    <td><div class="actions">
      <button class="act" title="Edit" onclick="editUser(${i})">${svg('edit')}</button>
      <button class="act danger" title="Hapus" onclick="delIdx('users',${i})">${svg('trash')}</button></div></td>
  </tr>`).join('')
  :`<tr><td colspan="5"><div class="empty"><div class="ic">${svg('users')}</div><h3>Belum ada pengguna</h3><p>Tambahkan operator dan admin yang boleh mengakses portal.</p></div></td></tr>`;
  return head('Users','Akun operator warehouse, PIC produksi, dan admin.',
    `<button class="btn btn-primary" onclick="addUser()">${svg('plus')} Tambah Pengguna</button>`)
    + backendNote('Autentikasi belum ada — daftar ini belum mengatur akses sungguhan.')
    + alertBox('info','info','Operator warehouse <b>satu akun untuk seluruh gedung</b> (A, G, F) sesuai keputusan Anda; pembatasan hanya berlaku untuk PIC produksi yang terikat jenis titik supply-nya.')
    + `<div class="table-wrap"><table><thead><tr><th>Pengguna</th><th>Role</th><th>Cakupan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};
const ROLE_OPTS=['SUPER_ADMIN','WAREHOUSE','PIC_PACKAGING','PIC_COVER','PIC_SEPARATOR'];
function addUser(){openModal('Tambah Pengguna',
  fld('Nama Lengkap','u_name')+fld('Username','u_user')+sel('Role','u_role',ROLE_OPTS)+
  fld('Cakupan','u_scope','text','Semua gedung','Warehouse = semua gedung. PIC = line yang dipegang.')+
  sel('Status','u_status',['active','inactive']),
  ()=>{if(!v('u_name'))return toast('Nama wajib diisi')||false;
    const l=DB.get('users',[]);l.push({name:v('u_name'),username:v('u_user'),role:v('u_role'),scope:v('u_scope'),status:v('u_status')});
    DB.set('users',l);logIt(`Pengguna ${v('u_name')} ditambahkan`);route();toast('Pengguna ditambahkan');});}
function editUser(i){const u=DB.get('users',[])[i];if(!u)return;
  openModal('Edit Pengguna',fld('Nama Lengkap','u_name','text',u.name)+fld('Username','u_user','text',u.username)+
    sel('Role','u_role',ROLE_OPTS,u.role)+fld('Cakupan','u_scope','text',u.scope||'')+sel('Status','u_status',['active','inactive'],u.status),
  ()=>{const l=DB.get('users',[]);l[i]={name:v('u_name'),username:v('u_user'),role:v('u_role'),scope:v('u_scope'),status:v('u_status')};
    DB.set('users',l);route();toast('Pengguna diperbarui');});}

/* ---------- SESSIONS (v1) ---------- */
PAGES.sessions=function(){
  const s=DB.get('sessions',[]);
  const rows=s.length?s.map((x,i)=>`<tr>
    <td class="cell-strong">${esc(x.user)}<div class="cell-sub">${esc(x.role||'')}</div></td>
    <td>${esc(x.started||'—')}</td>
    <td><span class="badge amber">${svgS('clock',13)} ${esc(x.remaining||'—')}</span></td>
    <td class="cell-sub">${esc(x.ip||'Tidak diketahui')}</td>
    <td><button class="btn btn-ghost" style="color:var(--red);border-color:var(--red-tint)" onclick="delIdx('sessions',${i})">Cabut akses</button></td>
  </tr>`).join('')
  :`<tr><td colspan="5"><div class="empty"><div class="ic">${svg('clock')}</div><h3>Belum ada sesi aktif</h3><p>Sesi login tablet warehouse dan PIC akan terdaftar di sini agar bisa dicabut sewaktu-waktu.</p></div></td></tr>`;
  return head('Sessions','Sesi login aktif pada tablet operator dan PIC.',
    `<button class="btn btn-ghost" onclick="mockSession()">${svg('plus')} Sesi contoh</button>`)
    + backendNote('Belum ada penyimpanan sesi (Redis/JWT), sehingga daftar ini belum mencerminkan login sungguhan.')
    + `<div class="table-wrap"><table><thead><tr><th>Pengguna</th><th>Mulai</th><th>Sisa</th><th>IP</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};
function mockSession(){
  const l=DB.get('sessions',[]);
  l.unshift({user:role().name,role:role().kind,started:new Date().toLocaleString('id-ID'),remaining:'59:00',ip:'192.168.110.'+(100+l.length)});
  DB.set('sessions',l);route();toast('Sesi contoh ditambahkan');
}

/* =====================================================================
   SELF-CHECK MENU — jaring pengaman anti "menu hilang saat relayout"
   ===================================================================== */
function menuAudit(){
  const navIds=new Set();
  const walk=items=>items.forEach(i=>{navIds.add(i.id);if(i.children)walk(i.children);});
  const savedRole=DB.get('role','SUPER_ADMIN');
  ROLES.forEach(r=>{DB.set('role',r.id);walk(navModel());});
  DB.set('role',savedRole);
  const missing=MENU_REGISTRY.filter(m=>{
    if(m.dynamic) return ![...navIds].some(id=>String(id).startsWith(m.dynamic));
    return !navIds.has(m.id);
  });
  const noPage=MENU_REGISTRY.filter(m=>!m.dynamic && typeof PAGES[m.id]!=='function');
  return {missing,noPage};
}
function selfCheckMenus(){
  const a=menuAudit();
  if(a.missing.length||a.noPage.length){
    console.warn('MENU HILANG:',a.missing.map(m=>m.label),'TANPA HALAMAN:',a.noPage.map(m=>m.label));
  }
  return a;
}

/* =====================================================================
   MODAL / FORM
   ===================================================================== */
function openModal(title,fields,onSave){
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="modal">
    <div class="m-head"><h3>${esc(title)}</h3><button class="icon-btn" style="margin-left:auto" onclick="closeModal()">&#10005;</button></div>
    <div class="m-body">${fields}</div>
    <div class="m-foot"><button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" id="modalSave">${svg('check')} Simpan</button></div></div>`;
  ov.classList.add('show');
  document.getElementById('modalSave').onclick=()=>{if(onSave()!==false)closeModal();};
  ov.onclick=e=>{if(e.target===ov)closeModal();};
}
function closeModal(){const ov=document.getElementById('overlay');ov.classList.remove('show');ov.innerHTML='';}
function fld(label,id,type,value,hint){
  return `<div class="form-field"><label>${esc(label)}</label><input id="${id}" type="${type||'text'}" value="${esc(value==null?'':value)}">${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`;
}
function sel(label,id,opts,val){
  return `<div class="form-field"><label>${esc(label)}</label><select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
}
function v(id){const e=document.getElementById(id);return e?e.value.trim():'';}

/* =====================================================================
   TEMA / SIDEBAR / TOAST
   ===================================================================== */
function setThemeBtn(){document.getElementById('themeBtn').innerHTML=svg(document.documentElement.dataset.theme==='dark'?'sun':'moon');}
function toggleTheme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('amr2_theme',d.dataset.theme);}catch(e){}setThemeBtn();}
(function(){let t='light';try{t=localStorage.getItem('amr2_theme')||'light';}catch(e){}document.documentElement.dataset.theme=t;})();

function toggleSidebar(){const s=document.getElementById('sidebar');s.classList.toggle('open');document.getElementById('scrim').classList.toggle('show',s.classList.contains('open'));}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');}

function toast(msg){
  const w=document.getElementById('toasts');
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=svg('check')+`<span>${esc(msg)}</span>`;
  w.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),250);},2800);
}

/* =====================================================================
   BOOT
   ===================================================================== */
renderChrome();
setThemeBtn();
selfCheckMenus();
if(!location.hash) location.hash=defaultPage();
route();
</script>
